params:
  # The site owner's identities, for JSON-LD `sameAs` (PaperMod's own param name).
  # Profiles only — no feed, no mail address, no link redirector such as matrix.to.
  # The IndieWeb follow-up (docs/concepts/indieweb-basics.md) reads the same list
  # for rel="me", so this stays the one place an identity is declared.
  schema:
    sameAs:
      - https://github.com/LNA-DEV
      - https://mastodon.online/@lna_dev
      - https://pixelfed.de/LNA-DEV
      - https://bsky.app/profile/lna-dev.net
      - https://www.instagram.com/lnadev/
  # Also the WebSite `name` in JSON-LD and og:site_name — see schema_json.html.
  ShortTitle: "LNA-DEV"
  CompanionUrl: "https://companion.lna-dev.net"
  ShowFullTextinRSS: true
  displayFullLangName: true
  mainSections: "posts"
  keywords:
    - LNA-DEV
    - Lukas Nagel
    - Blog
    - Privacy
    - Open Source
    - Photography
  # Language-RELATIVE on purpose: the licensing page exists in all three
  # languages. Every consumer resolves it with absLangURL / relLangURL.
  licensingPage: "/licensing/"
  # The site owner as ONE schema.org Person (layouts/partials/schema-person*.html).
  # `page` is the About page: the Person's `url`, the page that renders as a
  # ProfilePage, and the bundle holding the `portrait: true` image. `modelSlug` is
  # the owner's record in data/models.yaml, whose model page then shares the
  # Person's @id instead of describing a second, unrelated namesake.
  # `email` is PaperMod's and is never emitted into JSON-LD.
  author:
    name: Lukas Nagel
    alternateName: LNA-DEV
    page: /lukas-nagel
    modelSlug: lukas-nagel
    email: me@lna-dev.net
  images:
    - /assets/Pingüino/Pingüino.png
  footer:
    text: "Made with ❤️ by [Lukas Nagel]({{< ref \"lukas-nagel\" >}})"
  DateFormat: January 2, 2006
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false
  assets:
    favicon: /assets/Pingüino/Pingüino.svg
    favicon16x16: /assets/Pingüino/Pingüino.svg
    favicon32x32: /assets/Pingüino/Pingüino.svg
    apple_touch_icon: /assets/Pingüino/Pingüino.svg
    safari_pinned_tab: /assets/Pingüino/Pingüino.svg
  label:
    text: Home
    icon: /assets/Pingüino/Pingüino.svg
    iconHeight: 35
  socialIcons:
    - name: mastodon
      url: https://mastodon.online/@lna_dev
    - name: pixelfed
      url: https://pixelfed.de/LNA-DEV
    - name: bluesky
      url: https://bsky.app/profile/lna-dev.net
    - name: github
      url: https://github.com/LNA-DEV
    - name: matrix
      url: "https://matrix.to/#/@lna-dev:matrix.org"
    - name: email
      url: mailto:info@lna-dev.net
    - name: notification

    - name: rss
      url: index.xml
  editPost:
    URL: https://github.com/LNA-DEV/Home-Page/tree/main/content
    Text: Suggest Changes
    appendFilePath: true