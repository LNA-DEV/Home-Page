security:
  http:
    urls:
      - "https://api.github.com/.*"

baseURL: https://lna-dev.net
title: LNA-DEV ~ Lukas Nagel
theme:
  - github.com/adityatelange/hugo-PaperMod
# Gallery photos live outside the repo (Nextcloud) and are mounted in. The mount is
# NOT declared here: its source is an absolute, machine-specific path, so it lives in
# the gitignored `config/_default/module.yaml` instead (see CLAUDE.md "Build / Deploy").
# Do not re-add a `module.mounts` block here — `mounts` is replace-not-merge, so a list
# in this file would be silently discarded whole by that local override.
enableEmoji: true
defaultContentLanguage: en
defaultContentLanguageInSubdir: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: true
timeout: 600s
copyright: "🄯 [various licenses](/licensing/)"
# paginate: 3

markup:
  goldmark:
    # TODO Remove this to improve performance
    duplicateResourceFiles: true # https://gohugo.io/content-management/page-resources/#multilingual

imaging:
  meta:
    sources:
      - exif
      - iptc
      - xmp

# security.txt (RFC 9116) is generated rather than a static file, so its
# `Expires` is refreshed on every build instead of silently going stale.
# `path` is relative to the language directory, hence the `../`: the file has
# to sit at the domain root. It is emitted from `languages.en` only — all three
# languages would otherwise race on that one target path.
outputFormats:
  securitytxt:
    mediaType: text/plain
    baseName: security
    path: ../.well-known
    isPlainText: true
    notAlternative: true
  # The gallery metadata manifest: every resolved editorial value for every photo,
  # rendered from layouts/_default/home.gallerymeta.json. Hugo cannot write image
  # metadata, so scripts/gallery-embed-metadata.py does it after the build and reads
  # this file rather than re-implementing the resolver in Python. Unlike securitytxt
  # this one IS listed in the top-level `outputs.home` below: each language must
  # write its own copy, because the values it holds are language-dependent.
  gallerymeta:
    mediaType: application/json
    baseName: gallery-metadata
    isPlainText: true
    notAlternative: true
  # The nginx redirect map for renamed gallery images, rendered from
  # layouts/_default/home.nginxmap.map: every old image file stem (the store
  # filename, a former slug) -> the slug the build publishes the photo under now.
  # Hugo can redirect pages through aliases but not images, so nginx does it from
  # this list (docs/concepts/gallery-metadata-yaml-only.md §5, "The nginx side").
  # Like securitytxt it sits at the domain root (`../`) and is emitted from
  # `languages.en` only; it holds no baseURL, so the clearnet and onion builds
  # write the same bytes. nginx refuses to serve /_nginx/ to a visitor.
  nginxmap:
    mediaType: text/x-nginx-conf
    baseName: gallery-image-redirects
    path: ../_nginx
    isPlainText: true
    notAlternative: true

mediaTypes:
  text/x-nginx-conf:
    suffixes:
      - map

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - gallerymeta

minify:
  disableXML: true
  minifyOutput: false

languages:
  en:
    label: "🇬🇧 En"
    locale: en-US
    weight: 1
    outputs:
      home:
        - HTML
        - RSS
        - JSON
        - securitytxt
        # A per-language `outputs` REPLACES the top-level one, so gallerymeta has
        # to be restated here or English alone would emit no manifest.
        - gallerymeta
        - nginxmap
    params:
      description: I'm Lukas Nagel (LNA-DEV), sharing insights on development, tech, photography, and more on this page which serves as my digital hub.
      homeInfoParams:
        Title: Hello World 👋
        Content: |
          Welcome to my website.

          I am a software engineer from Bavaria, Germany. I am interested in cool technology, especially [Open Source](/en/tags/open-source/).
          I work with Linux, .NET, Kubernetes, containers, and many other cool technologies. 
          Besides that, I am also interested in [photography](https://lna-dev.net/en/gallery).

          This webpage acts as a "home base" for all the stuff I do on the internet.
          I will post here about all the different things I am interested in.
          Keep in mind that I post **different content** in **different languages**. So if you can, check out the other languages.

          [More about me](./lukas-nagel)
    menu:
      main:
        - name: 🙋🏻 About
          url: /lukas-nagel/
          weight: 1
        - name: 📰 Feed
          url: /feed/
          weight: 2
        - name: 🔎 Search
          url: /search/
          weight: 5
        - name: 🔖 Categories
          url: /categories/
          weight: 10
        - name: 🔗 Links
          url: /links/
          weight: 26
        - name: 🛠️ Projects
          url: /projects/
          weight: 28
        - name: 📷 Photography
          url: /gallery/
          weight: 30
  de:
    label: "🇩🇪 De"
    locale: de-DE
    weight: 2
    params: 
      description: Ich bin Lukas Nagel (LNA-DEV) und teile hier Einblicke in die Software-Entwicklung, IT im Allgemeinen, Fotografie und mehr.
      homeInfoParams:
        Title: Hallo Welt 👋
        Content: |
          Willkommen auf meiner Website.
          
          Ich bin ein Software-Entwickler aus Bayern und interessiere mich besonders für moderne Technologien, insbesondere [Open Source](/de/tags/open-source). 
          Ich arbeite mit Linux, .NET, Kubernetes, Containern und vielen anderen coolen Technologien. Ansonsten interessiere ich mich noch für [Fotografie](https://lna-dev.net/en/gallery).

          Diese Webseite dient als meine art "Home Base" für alles, was ich im Internet mache. 
          Hier werde ich über all die verschiedenen Dinge posten, die mich interessieren. Ich erstelle **verschiedenen Content** für **verschiedene Sprachen**.
          Schau also gerne in den anderen Sprachen vorbei.

          [Mehr über mich](./lukas-nagel)
    menu:
