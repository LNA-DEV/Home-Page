  controls the color. Brand marks (steam / switch / 3ds) are CC0 Simple Icons
  path data; anything else — `ds` and unknown/`other` — falls back to a generic
  gamepad glyph (Material Design Icons `gamepad-variant`, Apache-2.0).

  NB: do not reuse layouts/partials/svg.html here — its `steam` branch has
  broken, out-of-viewBox path data.
*/ -}}
