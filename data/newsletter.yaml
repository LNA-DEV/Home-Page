# Listmonk newsletter lists.
# The UUIDs come from the public subscription form Listmonk generates
# (Listmonk admin -> Lists -> public subscription page).
#
# Endpoints:
#   url     — Listmonk's subscription form. newsletter.js posts to it with fetch,
#             so the visitor stays in the panel, and the header CTA links to it
#             for a middle click. Cross-origin, so Listmonk has to answer with an
#             Access-Control-Allow-Origin header naming the site's origin: it
#             does for every origin under Settings -> Security -> Trusted URLs —
#             https://lna-dev.net, and http://localhost:1313 while developing.
#             The post is form-encoded, which keeps it a "simple" CORS request:
#             no OPTIONS preflight, so only the response needs the header.
#             Deliberately NOT /api/public/subscription: Listmonk (v6.2.0) checks
#             the captcha on this endpoint only, and the API takes a signup
#             without one — Caddy closes that route once ALTCHA is on.
#   captcha — the ALTCHA challenge newsletter.js solves before it posts. Listmonk
#             answers 404 while ALTCHA is off (Settings -> Security -> CAPTCHA),
#             and the form then posts without a solution, which Listmonk accepts
#             in that state.
# Both are gated by "Enable public subscription page" in Listmonk: with it off,
# the form 404s.
url: https://listmonk.lna-dev.net/subscription/form
captcha: https://listmonk.lna-dev.net/api/public/captcha/altcha

# The twelve lists are a complete language x topic matrix, which is why they are
# stored as one -- the UI lets the visitor pick languages and topics separately
# and ticks the intersection. `lists.<lang>.<topic>` must therefore stay
# complete: every language needs an entry for every topic, and the build fails
# loudly if one is missing.
#
# Language names are endonyms, so they read the same whatever language the
# visitor is browsing in -- same convention as the language switcher in
# hugo.yaml. Topic labels are NOT here: they are translated per visitor via the
# `newsletter_topic_<key>` i18n keys.
#
# Rendered by layouts/shortcodes/newsletter.html.
languages:
  - lang: en
    name: English
    flag: "🇬🇧"
  - lang: de
    name: Deutsch
    flag: "🇩🇪"
  - lang: sv
    name: Svenska
    flag: "🇸🇪"

topics:
  - general
  - tech
  - photography
  - images

