# Listmonk newsletter lists.
# The UUIDs come from the public subscription form Listmonk generates
# (Listmonk admin -> Lists -> public subscription page).
#
# Endpoints:
#   url    — the classic form POST. Leaves the site, and is what the form falls
#            back to with JavaScript off.
#   api — Listmonk's public endpoint, where the fetch goes so the visitor stays
#         in the panel. Cross-origin, so listmonk.lna-dev.net has to answer with
#         an Access-Control-Allow-Origin header naming the site's origin — both
#         https://lna-dev.net and http://localhost:1313 while developing.
#         The request is sent form-encoded, which keeps it a "simple" CORS
#         request: no OPTIONS preflight, so only the POST response needs the
#         header. Sending JSON instead would require answering preflights too.
# Both endpoints are gated by "Enable public subscription page" in Listmonk:
# with it off, the form 404s and the API 400s.
url: https://listmonk.lna-dev.net/subscription/form
api: https://listmonk.lna-dev.net/api/public/subscription

# The twelve lists are a complete language x topic matrix, which is why they are
# stored as one -- the UI lets the visitor pick languages and topics separately
# and ticks the intersection. `lists.<lang>.<topic>` must therefore stay
# complete: every language needs an entry for every topic, and the build fails
# loudly if one is missing.
#
# Language names are endonyms, so they read the same whatever language the
# visitor is browsing in -- same convention as the language switcher in
# hugo.yaml. Topic labels are NOT here: they are translated per visitor via the
# `newsletter_topic_<key>` i18n keys.
#
# Rendered by layouts/shortcodes/newsletter.html.
languages:
  - lang: en
    name: English
    flag: "🇬🇧"
  - lang: de
    name: Deutsch
    flag: "🇩🇪"
  - lang: sv
    name: Svenska
    flag: "🇸🇪"

topics:
  - general
  - tech
  - photography
  - images

