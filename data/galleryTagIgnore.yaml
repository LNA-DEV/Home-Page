# Gallery tags to hide everywhere.
#
# Gallery tags are the UNION of `tags:` in data/gallery.yaml and the `dc:subject`
# list darktable writes into the exported JPEG (see CLAUDE.md, gallery system).
# The camera and the export chain write their own strings into that same list,
# and those are not tags a reader should ever see. This file drops them at the
# one choke point that forms the union — layouts/partials/collect-images.html —
# so they disappear from the photo pages, the grids, the RSS categories, the
# schema.org keywords AND the metadata embedded into the served files by
# scripts/gallery-embed-metadata.py, which is fed the already-filtered list.
#
# Matching happens AFTER the tag has been lowercased and trimmed, which is how
# collect-images.html normalises every tag. So write entries in lower case.
#
#   titles    exact matches (post-lowercasing)
#   patterns  Go regular expressions, matched with findRE against the whole tag.
#             Anchor them (^…$) unless a substring match is really what you want.
#
# A workflow tag like `ToBeUploaded` does not belong here: darktable never
# exports a tag marked *private*, which is the better fix and needs no code.

titles:
  # Panasonic drive/merge modes, written by the body into dc:subject.
  - "zsl_sdr"
  - "aeb_sdr"

patterns:
  # Panasonic bodies write the source clip path of a frame grab as a tag,
  # e.g. `100_PANA\P1000899.MP4`. A backslash never appears in a real tag.
  - '\\'
