    en: "The jaguar is a large cat species and the only living member of the genus Panthera that is native to the Americas. Its distinctively marked coat features pale yellow to tan colored fur covered by spots that transition to rosettes on the sides, although a melanistic black coat appears in some individuals. With a body length of up to 1.85 m and a weight of up to 158 kg (348 lb), it is the biggest cat species in the Americas and the third largest in the world."
    de: "Der Jaguar ist eine Art aus der Familie der Katzen, die in der Neuen Welt verbreitet ist. Ältere Bezeichnungen für den Jaguar sind Unze, Onze oder Onza. Nach dem Tiger und dem Löwen ist der Jaguar die drittgrößte Katze überhaupt."
