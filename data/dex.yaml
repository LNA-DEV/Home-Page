  body_weight: "0.3–0.5 kg"
  diet: piscivore
  lifespan: "20–30"
  habitat:
    en: Coastal cliffs, Open ocean
    de: "Küstenklippen, Offenes Meer"
  reference:
    credit: Charles J. Sharp, CC BY-SA 4.0, Wikimedia Commons
    credit_url: "https://commons.wikimedia.org/wiki/File:Puffin_%28Fratercula_arctica%29.jpg"
    commons_file: Puffin (Fratercula arctica).jpg
    file: atlantic-puffin.jpg
  names:
    en: Atlantic Puffin
    de: Papageitaucher
    sv: "Lunnefågel"
  description:
    en: "A charismatic seabird with a colourful bill that spends most of its life at sea. Nests in burrows on coastal cliffs and can carry 10+ fish crosswise in its bill. Populations declining due to climate-driven changes in prey fish distribution."
    de: "Ein charismatischer Seevogel mit buntem Schnabel, der den Großteil seines Lebens auf dem Meer verbringt. Nistet in Höhlen an Küstenklippen und kann 10+ Fische quer im Schnabel tragen. Populationen rückläufig durch klimabedingte Veränderungen der Beutefischverteilung."
  tips:
    best_time:
      en: "May–August breeding season. Midday for best light on cliffs."
      de: "Mai–August Brutsaison. Mittags für bestes Licht an den Klippen."
    approach:
      en: "Visit a breeding colony (Farne Islands, Skellig Michael, Látrabjarg). Puffins at established colonies are remarkably tame — sit near burrow entrances and they'll walk right past. A 70–200mm zoom is ideal. Lie flat for eye-level shots. Best images come when they return with beaks full of sand eels. Wind and rain are common, so protect your gear."
      de: "Eine Brutkolonie besuchen (Farne Islands, Skellig Michael, Látrabjarg). Papageitaucher an etablierten Kolonien sind bemerkenswert zahm — in der Nähe von Höhleneingängen sitzen und sie laufen direkt vorbei. Ein 70–200mm Zoom ist ideal. Flach hinlegen für Aufnahmen auf Augenhöhe. Die besten Bilder entstehen wenn sie mit vollem Schnabel Sandaale zurückkehren. Wind und Regen sind häufig — Ausrüstung schützen."
