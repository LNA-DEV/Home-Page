  description:
    en: "The European bison or the European wood bison, also known as the wisent, the zubr, or sometimes colloquially as the European buffalo, is a European species of bison. It is one of two extant species of bison, alongside the American bison. The European bison is the heaviest wild land animal in Europe, and individuals in the past may have been even larger than their modern-day descendants."
    de: "Der Wisent oder Europäische Bison ist eine europäische Rinderart (Bovini). Wisente kamen bis in das frühe Mittelalter in den Urwäldern von West-, Zentral- und Südosteuropa vor. Ihr Lebensraum sind gemäßigte Laub-, Nadel- und Mischwälder mit großen Offenlandflächen."
