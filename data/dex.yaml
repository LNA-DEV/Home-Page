    de: "Die Lederschildkröte ist die größte lebende Schildkröte und wird meistens als einzige rezente Angehörige der gleichnamigen Familie (Dermochelyidae) angesehen. Sie zählt somit zoologisch nicht zur Familie der Meeresschildkröten (Cheloniidae), wird aber zusammen mit diesen in die Überfamilie Chelonioidea vereint, die im Deutschen manchmal ebenfalls als Meeresschildkröten bezeichnet wird. Ihr Lebensraum sind tropische und subtropische Meere."
