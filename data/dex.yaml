  description:
    en: "The Asian elephant, also known as the Asiatic elephant, is the only living species in the genus Elephas. It is the largest living land animal in Asia and the second largest living elephantid in the world. It is characterised by its long trunk with a single finger-like process; large tusks in males; laterally folded large ears and wrinkled grey skin that is partly depigmented on the trunk, ears or neck."
    de: "Der Asiatische Elefant ist eine Art aus der Familie der Elefanten und nach dem Afrikanischen Elefanten das zweitgrößte Landtier der Erde. Wie sein afrikanischer Vetter zeichnet er sich durch den Rüssel, die (kleineren) Stoßzähne, die säulenförmigen Beine und die allgemeine Körpergröße aus. Beide unterscheiden sich aber in der Größe der Ohren, der etwas anders verlaufenden Rückenlinie und in zahlreichen anatomischen Einzelmerkmalen."
