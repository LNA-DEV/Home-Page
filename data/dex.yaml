    en: "The mute swan is a species of swan and a member of the waterfowl family Anatidae. It is native to much of Europe and parts of Asia and the far north of Africa. It is an introduced species in North America, home to the largest populations outside of its native range, with additional smaller introductions in Australasia and Southern Africa."
    de: "Der Höckerschwan ist eine Vogelart, die innerhalb der Entenvögel (Anatidae) zur Gattung der Schwäne (Cygnus) und zur Unterfamilie der Gänse (Anserinae) gehört. Als halbdomestizierter Vogel ist er heute in weiten Bereichen Mitteleuropas beheimatet. Er hält sich bevorzugt auf Seen, Park- und Fischteichen, in seichten Meeresbuchten und im Winter auch auf offenen Flussläufen auf."
    sv: "Knölsvan är en stor andfågel, inom släktet Cygnus, som främst förekommer i Europas och Asiens tempererade områden så långt österut som Kina. Knölsvan har introducerats till ett flertal områden runt om i världen, bland annat Nordamerika och Australien. Som adult har den ett vingspann på drygt två meter, en kraftig kropp, lång böjlig hals, litet huvud, vit fjäderdräkt och orange näbb med svart knöl på ovansidan av näbbroten."
  description_source:
    en: "https://en.wikipedia.org/wiki/Mute_swan"
    de: "https://de.wikipedia.org/wiki/H%C3%B6ckerschwan"
    sv: "https://sv.wikipedia.org/wiki/Kn%C3%B6lsvan"
