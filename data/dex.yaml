    en: "The common ringed plover, great ringed plover or ringed plover is a species of bird in the family Charadriidae. It breeds across much of northern Eurasia, as well as Greenland."
    de: "Der Sandregenpfeifer, auch Halsbandregenpfeifer genannt, ist eine Vogelart aus der Familie der Regenpfeifer (Charadriidae). Er ist ein Brutvogel im Norden Europas, Asiens, Süd- und Nordamerikas. In Mitteleuropa brütet er im Küstengebiet der Nord- und Ostsee."
