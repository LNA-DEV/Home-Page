    sv: "Lärkfalk är en medelstor falk som häckar över stora delar av Palearktis. Den är en snabb och skicklig flygare som lever av stora insekter och småfåglar som den fångar i luften. För sitt födosök är den beroende av vatten varför den ofta uppträder vid sjöar, myrar eller vid kusten."
