    en: "The Tasmanian devil is a carnivorous marsupial of the family Dasyuridae. It was formerly present across mainland Australia, but became extinct there around 3,500 years ago; it is now confined to the island of Tasmania. The size of a small dog, the Tasmanian devil became the largest carnivorous marsupial in the world following the extinction of the thylacine in 1936."
    de: "Der Beutelteufel, auch Tasmanischer Teufel genannt, ist eine Tierart aus der Familie der Raubbeutler (Dasyuridae) und deren größter lebender Vertreter. In der rekonstruierten Sprache Palawa Kani der tasmanischen Aborigines wird er als Purinina bezeichnet. Mit Ausnahme von wenigen dutzend Tieren als Teil eines Wiederansiedlungsprojekts auf dem australischen Festland, wo die Tierart wahrscheinlich schon im 14."
