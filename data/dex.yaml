    en: "The European bee-eater is a bird species in the bee-eater family, Meropidae. It breeds in southern and central Europe, northern and southern Africa, and western Asia. Except for the resident southern African population, the species is strongly migratory, wintering in tropical Africa."
    de: "Der Bienenfresser, selten auch – fälschlich, da nicht zu den Spechten gehörend – „Bienenspecht“ genannt, ist ein auffallend bunter Vogel aus der gleichnamigen Familie der Bienenfresser (Meropidae). Er gehört zu den in Afrika überwinternden Zugvögeln."
