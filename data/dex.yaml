  description:
    en: "The hippopotamus, often shortened to hippo, further qualified as the common hippopotamus, Nile hippopotamus and river hippopotamus, is a large semiaquatic mammal native to sub-Saharan Africa. It is one of only two extant species in the family Hippopotamidae, the other being the pygmy hippopotamus. Its name comes from the Ancient Greek for \"river horse\" (ἱπποπόταμος)."
    de: "Das Flusspferd, auch Großflusspferd genannt, ist eine Säugetierart aus der Familie der Flusspferde und der Ordnung der Paarhufer. Innerhalb der Gattung Hippopotamus gilt es inzwischen als einziges Mitglied. Nach den Elefanten und neben einigen Vertretern der Nashörner und der Giraffen zählt es zu den größten landbewohnenden Tieren."
