  names:
    en: European Badger
    de: "Europäischer Dachs"
    sv: "Europeisk grävling"
  description:
    en: "The European badger, also known as the Eurasian badger, is a species of badger in the family Mustelidae native to Europe and West Asia and parts of Central Asia. It is classified as least concern on the IUCN Red List due to its wide range and large, stable population size which is thought to be increasing in some regions. Several subspecies are recognised, with the nominate subspecies predominating in most of Europe."
    de: "Der Europäische Dachs ist ein Raubtier aus der Familie der Marder und eine von vier Arten der Gattung Meles, die noch bis Anfang der 2000er Jahre in einer Art zusammengefasst waren. Volkstümlich wird der Dachs auch – vor allem in der Fabel – als „Grimbart“ bezeichnet."
