    de: "Die Westliche Honigbiene, auch Europäische Honigbiene, meist einfach Biene, Honigbiene und oberdeutsch auch Imme genannt, gehört zur Familie der Echten Bienen (Apidae), innerhalb derer sie eine Vertreterin der Gattung der Honigbienen (Apis) ist. Ihr ursprüngliches Verbreitungsgebiet war Europa, Afrika und Vorderasien. Da dieses Insekt Honig produziert, wird sie durch den Menschen genutzt (Imkerei) und zählt zu den wichtigsten Nutztieren in der Landwirtschaft."
