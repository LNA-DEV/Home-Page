    de: "Der Habichtskauz oder Uralkauz ist eine große Eule aus der Gattung Strix innerhalb der Familie der Eigentlichen Eulen (Strigidae). Er ähnelt dem Waldkauz, ist aber kontrastreicher gefärbt, bedeutend größer und oft mehr als doppelt so schwer wie dieser. Das geschlossene Verbreitungsgebiet der Art liegt im borealen Waldgürtel der Paläarktis und reicht ostwärts bis Korea und Japan."
    sv: "Slaguggla är en medelstor nattaktiv uggla av släktet Strix, med nio underarter i Europa och norra Asien. Den norra populationen häckar på tajga med grovstammiga barrträd och myrar medan den lilla populationen som återfinns i södra Europa häckar i bok- och bergsskogar. Det globala beståndet kategoriseras som livskraftigt."
