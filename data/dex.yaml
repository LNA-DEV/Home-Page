  description:
    en: "The plains zebra is the most common and geographically widespread species of zebra. Its range is fragmented, but spans much of southern and eastern Africa south of the Sahara. Six or seven subspecies have been recognised, including the quagga which was thought to be a separate species."
    de: "Das Steppenzebra oder Pferdezebra ist ein Zebra aus der Gattung der Pferde (Equus) innerhalb der Familie der Pferde (Equidae). Es stellt heute die häufigste Zebra-Art in Afrika dar und ist vom Nordosten bis in den Süden des Kontinents verbreitet. Es lebt gesellig in kleinen Herdenverbänden und ernährt sich hauptsächlich von Gräsern."
