  description:
    en: "The European herring gull or simply herring gull is a large gull, up to 66 cm (26 in) long. It breeds throughout the northern and western coasts of Europe. Some European herring gulls, especially those resident in colder areas, migrate farther south in winter, but many are permanent residents, such as in Ireland, Britain, Iceland, or on the North Sea shores."
    de: "Die Silbermöwe ist eine Vogelart innerhalb der Möwen (Larinae) und die häufigste Großmöwe in Nord- und Westeuropa. Ihr Verbreitungsgebiet erstreckt sich vom Weißen Meer über die Küsten Fennoskandiens, der Ostsee, der Nordsee und des Ärmelkanals sowie über große Teile der Atlantikküste Frankreichs und der Britischen Inseln. Außerdem kommt die Art auf Island vor."
    sv: "Gråtrut är en havsfågel inom familjen måsfåglar (Laridae). Den har vit undersida, vitt huvud, grå vingovansida, gul näbb med en röd fläck och vanligen skära ben. Fågeln förekommer i norra och västra Europa, från Barents hav till Biscayabukten i Frankrike."
