    de: "Die Schnatterente, in älterer Literatur auch Mittelente oder Knarrente genannt, ist eine Vogelart aus der Familie der Entenvögel (Anatidae). Der mittlerweile altertümliche Begriff Mittelente drückt aus, dass ihre Körpergröße zwischen der der kleineren europäischen Entenarten und der Stockente liegt. Der Begriff Schnatterente weist dagegen auf die Art ihrer Nahrungsaufnahme hin."
