  description:
    en: "The cheetah is a species of large feline and the only living member of the genus Acinonyx. An iconic pursuit predator, it is the fastest land animal, capable of running at 93–104 km/h (58–65 mph); it has evolved for speed, having powerful hindlimb muscles, long limbs and a flexible spine. The cheetah has a tawny to creamy white or pale buff fur that is marked with evenly spaced, solid black spots."
    de: "Der Gepard [ˈgeːpart/geˈpart] ist ein hauptsächlich in Afrika verbreitetes Raubtier, das zur Familie der Katzen gehört. Die in ihrem Jagdverhalten hoch spezialisierten Geparde sind die schnellsten Landtiere der Welt. Damit verbunden gibt es in Gestalt und Körperbau deutliche Unterschiede zu anderen Katzenarten, weshalb dem Gepard traditionell eine eigene Unterfamilie eingeräumt wurde."
