    en: "The green sea turtle, also known as the green turtle, black sea turtle, and Pacific green turtle, is a species of large sea turtle of the family Cheloniidae. It is the only species in the genus Chelonia. Its range extends throughout tropical and subtropical seas around the world, with two distinct populations in the Atlantic and Pacific Oceans, but it is also found in the Indian Ocean."
    de: "Die Grüne Meeresschildkröte ist ein Vertreter der Familie der Meeresschildkröten und stellt eine der bekanntesten Arten dieser Gruppe dar. Die ehemals als Unterart von Chelonia mydas bezeichnete Schwarze Meeresschildkröte wird heute zumeist als eigene Art Chelonia agassizii geführt. Der Name Grüne Meeresschildkröte entspricht der im englischen Sprachraum üblichen Bezeichnung „green turtle“, doch ist beispielsweise in Mexiko der Name „tortuga blanca“ üblich."
