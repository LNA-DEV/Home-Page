  names:
    en: Hooded Crow
    de: "Nebelkrähe"
    sv: "Gråkråka"
  description:
    en: "The hooded crow, also colloquially called just hoodie, is a Eurasian bird subspecies of the carrion crow in the genus Corvus. Widely distributed, it is found across Northern, Eastern, and Southeastern Europe, as well as parts of the Middle East. It is an ashy-grey bird with black head, throat, wings, tail, and thigh feathers, as well as a black bill, eyes, and feet."
    de: "Die Nebelkrähe ist eine eurasische Vogelart der Gattung Corvus und gehört zur Familie der Rabenvögel (Corvidae). Sie ist weit verbreitet und kommt in Nord-, Mittel-, Ost- und Südosteuropa sowie in Teilen des Nahen Ostens vor. Die Nebelkrähe ist ein aschgrauer Vogel mit schwarzem Kopf, Hals, Flügeln, Schwanz und Oberschenkelfedern sowie einem schwarzen Schnabel, Augen und Füßen."
- slug: carrion-crow
