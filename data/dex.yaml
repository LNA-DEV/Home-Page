    en: "The toco toucan is a species of bird in the toucan family Ramphastidae. It is the largest species of toucan and has a distinctive appearance, with a black body, a white throat, chest and uppertail-coverts, and red undertail-coverts. Its most conspicuous feature is its huge beak, which is yellow-orange with a black base and large spot on the tip."
    de: "Der Riesentukan ist eine Vogelart aus der Familie der Tukane (Ramphastidae) und der Ordnung der Spechtvögel (Piciformes). Wie der Name vermuten lässt, handelt es sich um eine sehr große Tukanart mit einem ebenso überdimensionalen, auffällig orange gefärbtem Schnabel, der die Art unverwechselbar macht. Der Vogel kommt ausschließlich in Südamerika vor und ist die einzige Tukanart, die geschlossene Waldgebiete weitgehend meidet."
