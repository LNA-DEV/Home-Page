  description:
    en: "The European goldfinch or simply referred to as the goldfinch is a small passerine bird in the finch family that is native to the Palearctic zone in Europe, northern Africa, and western Asia. It has been introduced to other areas, including Australia, New Zealand, Uruguay and the United States."
    de: "Der Stieglitz, auch Distelfink genannt, ist eine Vogelart aus der Familie der Finken (Fringillidae). Er besiedelt Eurasien von Westeuropa bis Vorderasien sowie Nordafrika. In Südamerika und Australien sowie auf Neuseeland und einigen Inseln Ozeaniens wurde er eingeführt."
