    de: "Der Bartgeier, veraltet auch Lämmergeier genannt, ist ein Greifvogel aus der Familie der Habichtartigen (Accipitridae). Er bildet die einzige Art der gleichnamigen Gattung (Gypaetus). Traditionell zählte er zur Unterfamilie der Altweltgeier (Aegypiinae), ehe er aufgrund molekulargenetischer Untersuchungen mit dem Schmutzgeier und dem Palmgeier in eine eigene Unterfamilie (Gypaetinae) gestellt wurde."
    sv: "Lammgam är en gam som förekommer i bergiga områden i Asien, Afrika och södra Europa. Den placeras som ensam art inom släktet Gypaetus, inom familjen hökartade rovfåglar, och är i motsats till de flesta gamar befjädrad på huvud och hals. Globalt bedöms populationen av lammgam som livskraftig, men i exempelvis Europa och södra Afrika är den hotad."
