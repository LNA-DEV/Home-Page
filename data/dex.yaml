    en: "The cirl bunting is a passerine bird in the bunting family Emberizidae, a group now separated by most modern authors from the finches, Fringillidae."
    de: "Die Zaunammer ist eine Sperlingsvogelart aus der Familie der Ammern (Emberizidae). Die Zaunammer ist ein Standvogel – ihr Verbreitungsgebiet erstreckt sich über den Süden Europas und Nordafrika. In Süddeutschland gibt es kleine Bestände in wärmeexponierten Lagen."
