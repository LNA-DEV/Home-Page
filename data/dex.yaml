# data/dex.yaml — the photo dex species list.
#
# One record per species. A species counts as "photographed" when at least one
# entry in data/gallery.yaml carries its slug in `species:` — there is no
# separate caught/uncaught flag to keep in sync.
#
# Language-neutral facts (scientific name, family, measurements, taxon keys) sit
# at the top level; anything that reads as prose is nested per language under
# names / description / habitat / tips, and falls back to `en` when a language is
# missing.
#
# Maintained by scripts/dex-import.py, scripts/dex-enrich.py,
# scripts/dex-ranges.py and scripts/dex-covers.py — see AGENTS.md.

species:
- slug: red-fox
  number: "001"
  scientific: Vulpes vulpes
  family: Canidae
  group: mammals
  difficulty: easy
  iucn: LC
  gbif_taxon_key: 5219243
  inat_taxon_id: 42069
  wikidata_id: Q8332
  height: "35–50 cm"
  body_weight: "4–14 kg"
  diet: omnivore
  lifespan: "3–10"
  habitat:
    en: Forests, Tundra, Urban
    de: "Wälder, Tundra, Städtisch"
  reference:
    credit: ClaudiaTen, CC BY-SA 4.0, Wikimedia Commons
    credit_url: "https://commons.wikimedia.org/wiki/File:Portrait_of_a_red_fox_in_Rautas_fj%C3%A4llurskog.jpg"
    commons_file: "Fox at the British Wildlife Centre, Newchapel, Surrey - geograph.org.uk - 2221750.jpg"
  names:
    en: Red Fox
    de: Rotfuchs
    sv: "Rödräv"
  description:
    en: "The red fox is the largest of the true foxes, and the most widely distributed member of the order Carnivora. It is present across the entire Northern Hemisphere, including most of North America, Europe and Asia, as well as parts of North Africa. Its range has expanded alongside human settlement, with the species having been introduced to Australia, where it preys on native small and medium-sized rodents and marsupials."
    de: "Der Rotfuchs ist der einzige mitteleuropäische Vertreter der Füchse und wird daher meistens als „der Fuchs“ bezeichnet. Er ist in Europa der häufigste Wildhund."
  tips:
    best_time:
      en: "Dawn and dusk, year-round. Cubs visible Mar–May."
      de: "Morgen- und Abenddämmerung, ganzjährig. Junge sichtbar Mär–Mai."
    approach:
      en: "Foxes in urban areas are habituated to people — sit quietly and they'll often approach you. In rural settings, use a hide near known paths or den sites. Downwind approach is essential. A 200–400mm lens is usually enough. They're most active in low light, so bring a fast lens or raise ISO."
      de: "Füchse in Stadtgebieten sind an Menschen gewöhnt — ruhig sitzen bleiben und sie kommen oft von selbst. In ländlichen Gebieten ein Versteck an bekannten Pfaden oder Bauten nutzen. Gegen den Wind annähern ist wichtig. Ein 200–400mm Objektiv reicht meist. Am aktivsten bei schwachem Licht, also schnelles Objektiv oder hohe ISO mitbringen."
- slug: grey-wolf
  number: "002"
  scientific: Canis lupus
  family: Canidae
  group: mammals
  difficulty: challenging
  iucn: LC
  gbif_taxon_key: 5219173
  inat_taxon_id: 42048
  wikidata_id: Q18498
  height: "80–85 cm"
  body_weight: "30–80 kg"
  diet: carnivore
  lifespan: "6–8"
  habitat:
    en: Forests, Tundra, Grasslands
    de: "Wälder, Tundra, Grasland"
  reference:
    credit: "User:Mas3cf, CC BY-SA 4.0, Wikimedia Commons"
    credit_url: "https://commons.wikimedia.org/wiki/File:Eurasian_wolf_2.jpg"
    commons_file: Eurasian wolf 2.jpg
    file: grey-wolf.jpg
  names:
    en: Grey Wolf
    de: Grauwolf
    sv: Varg
  description:
    en: "The largest extant member of Canidae. Highly social, living in nuclear families with complex communication through howling, body language, and scent marking. Apex predator across the Northern Hemisphere."
    de: "Das größte lebende Mitglied der Hundeartigen. Sehr sozial, lebt in Familienverbänden mit komplexer Kommunikation durch Heulen, Körpersprache und Duftmarkierung. Spitzenprädator auf der gesamten Nordhalbkugel."
  tips:
    best_time:
      en: Winter for tracks in snow. Dawn howling sessions year-round.
      de: "Winter für Spuren im Schnee. Morgendliches Heulen ganzjährig."
    approach:
      en: "Extremely wary — direct approach rarely works. Use a vehicle as a hide in parks like Yellowstone. In Europe, stake out feeding sites or known crossing points. A 500mm+ lens is essential. Patience is everything — multiple days may be needed. Listen for howling at dawn to locate packs."
      de: "Extrem scheu — direkte Annäherung funktioniert selten. In Parks wie Yellowstone das Fahrzeug als Versteck nutzen. In Europa Futterstellen oder bekannte Wechsel beobachten. Ein 500mm+ Objektiv ist unerlässlich. Geduld ist alles — mehrere Tage können nötig sein. Bei Morgengrauen auf Heulen achten um Rudel zu orten."
- slug: barn-owl
  number: "003"
  scientific: Tyto alba
  family: Tytonidae
  group: birds
  difficulty: moderate
  iucn: LC
  gbif_taxon_key: 2497921
  inat_taxon_id: 20445
  wikidata_id: Q25317
  height: "33–39 cm"
  body_weight: "0.2–0.7 kg"
  diet: carnivore
  lifespan: "4"
  habitat:
    en: Farmland, Grasslands, Woodland edges
    de: "Ackerland, Grasland, Waldränder"
  reference:
    credit: "User:Alun Williams333, CC BY-SA 4.0, Wikimedia Commons"
    credit_url: "https://commons.wikimedia.org/wiki/File:Tyto_alba_tylluan_wen_detail.jpg"
    commons_file: Tyto alba tylluan wen detail.jpg
    file: barn-owl.jpg
  names:
    en: Barn Owl
    de: Schleiereule
    sv: Tornuggla
  description:
    en: "One of the most widespread land birds, found on every continent except Antarctica. Distinguished by a heart-shaped facial disc that channels sound to asymmetric ears, enabling precision hunting in complete darkness."
    de: "Einer der am weitesten verbreiteten Landvögel, auf jedem Kontinent außer der Antarktis zu finden. Ausgezeichnet durch einen herzförmigen Gesichtsschleier, der Schall zu asymmetrischen Ohren leitet und präzise Jagd in völliger Dunkelheit ermöglicht."
  tips:
    best_time:
      en: "Dusk and just after sunset. Winter evenings when hunting starts earlier."
      de: "Abenddämmerung und kurz nach Sonnenuntergang. Winterabende wenn die Jagd früher beginnt."
    approach:
      en: "Scout for regular hunting routes along field edges and hedgerows — they often follow the same flight path nightly. Park near the route and wait in a vehicle. Flash photography is discouraged near nest sites. A 300mm lens at high ISO works well. They fly silently and low, so be ready for fast panning shots."
      de: "Regelmäßige Jagdrouten entlang von Feldrändern und Hecken erkunden — sie folgen oft allnächtlich demselben Flugpfad. In der Nähe der Route im Fahrzeug warten. Blitzfotografie an Nestplätzen vermeiden. Ein 300mm Objektiv bei hoher ISO funktioniert gut. Sie fliegen leise und niedrig — bereit sein für schnelle Mitzieher."
- slug: european-hedgehog
  number: "004"
  scientific: Erinaceus europaeus
  family: Erinaceidae
  group: mammals
  difficulty: easy
  iucn: NT
  gbif_taxon_key: 5219616
  inat_taxon_id: 43042
  wikidata_id: Q6145
  height: "20–30 cm (length)"
  body_weight: "0.6–1.2 kg"
  diet: omnivore
  lifespan: "3–8"
  habitat:
    en: Gardens, Hedgerows, Woodland edges
    de: "Gärten, Hecken, Waldränder"
  reference:
    credit: "Michael Gäbler, CC BY-SA 3.0, Wikimedia Commons"
    credit_url: "https://commons.wikimedia.org/wiki/File:Erinaceus_europaeus_%28Linnaeus%2C_1758%29.jpg"
    commons_file: Erinaceus europaeus (Linnaeus, 1758).jpg
    file: european-hedgehog.jpg
  names:
    en: European Hedgehog
    de: Braunbrustigel
    sv: Igelkott
  description:
    en: "A nocturnal insectivore covered in approximately 5,000–7,000 spines. Rolls into a tight ball when threatened. An iconic garden visitor across Western Europe, though populations have declined significantly in recent decades."
    de: "Ein nachtaktiver Insektenfresser mit etwa 5.000–7.000 Stacheln. Rollt sich bei Gefahr zu einer festen Kugel zusammen. Ein ikonischer Gartenbesucher in Westeuropa, dessen Populationen in den letzten Jahrzehnten deutlich zurückgegangen sind."
  tips:
    best_time:
      en: "After dark, spring through autumn. Most active on warm, damp nights."
      de: "Nach Einbruch der Dunkelheit, Frühling bis Herbst. Am aktivsten in warmen, feuchten Nächten."
    approach:
      en: "Leave cat food or mealworms in a garden to attract them, then wait quietly nearby. They have poor eyesight and rely on smell — stay downwind and move slowly. A macro or short telephoto (100mm) works for close-up portraits. Use a dim red torch to avoid startling them. Very tolerant once feeding."
      de: "Katzenfutter oder Mehlwürmer im Garten auslegen, dann ruhig in der Nähe warten. Sie haben schlechte Augen und verlassen sich auf den Geruch — gegen den Wind bleiben und langsam bewegen. Ein Makro oder kurzes Tele (100mm) eignet sich für Nahporträts. Eine schwache rote Taschenlampe verwenden um sie nicht zu erschrecken. Sehr tolerant sobald sie fressen."
- slug: atlantic-puffin
  number: "005"
  scientific: Fratercula arctica
  family: Alcidae
  group: birds
  difficulty: moderate
