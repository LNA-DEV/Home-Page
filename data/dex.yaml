  description:
    en: "The yellow-legged gull or western yellow-legged gull is a large gull found in Europe, the Middle East and North Africa, which has only recently achieved wide recognition as a distinct species. It was formerly treated as a subspecies of either the Caspian gull L. cachinnans, or more broadly as a subspecies of the herring gull L."
    de: "Die Mittelmeermöwe ist eine Vogelart innerhalb der Möwen (Larinae). Sie brütet in Makaronesien, an der Biskaya, auf der Iberischen Halbinsel, im Mittelmeer- und im Schwarzmeerraum. Zerstreute Vorkommen gibt es auch im nördlichen West- und Mitteleuropa."
- slug: hooded-crow
