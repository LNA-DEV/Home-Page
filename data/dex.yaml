    de: "Der Turmfalke ist der am häufigsten vorkommende Falke Mitteleuropas. Der Öffentlichkeit ist er relativ vertraut, da er sich auch Städte und Stadträume als Lebensraum erobert hat und öfter beim „Rüttelflug“ zu beobachten ist."
    sv: "Tornfalk är en medelstor rovfågel som ofta ses ryttla över fält och öppna ytor, som kalhyggen och myrar. Tornfalken är en av Europas talrikaste rovfåglar."
