  description:
    en: "The white wagtail is a small passerine bird in the family Motacillidae, which also includes pipits and longclaws. The species breeds in the Palearctic zone in most of Europe and Asia and parts of North Africa; it also has a toehold in western Alaska as a scarce breeder. It is resident in the mildest parts of its range, but otherwise migrates to Africa."
    de: "Die Bachstelze ist eine Singvogelart aus der Familie der Stelzen und Pieper. Sie fällt durch ihr kontrastreiches, schwarz-weiß-graues Gefieder und den stelzentypischen Wippschwanz auf. Der charakteristische Ruf ist ein hohes, metallisches dschiwid."
