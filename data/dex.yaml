  description:
    en: "The Eurasian otter, also known as the European otter, Eurasian river otter, European river otter, common otter, and Old World otter, is a semiaquatic mammal native to Eurasia and the Maghreb. it is the most widely distributed member of the otter subfamily (Lutrinae) of the weasel family (Mustelidae) and is found in the waterways and on the coasts of Europe, much of Asia, and parts of North Africa. The Eurasian otter eats mainly of fish, and is strongly territorial."
    de: "Der Fischotter ist ein an das Wasserleben angepasster Marder, der zu den besten Schwimmern unter den Landraubtieren zählt. Er kommt in fast ganz Europa vor und wird einschließlich Schwanz etwa 130 Zentimeter lang. Eine eindeutigere Bezeichnung für diese Art ist Eurasischer Fischotter, da es in der Gruppe der Otter noch weitere Arten gibt, die Fischotter heißen, beispielsweise den Indischen oder die Amerikanischen Fischotter."
- slug: moose
