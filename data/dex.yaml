    en: "The brant or brent goose is a small goose of the genus Branta. There are three subspecies, all of which winter along temperate-zone sea-coasts and breed on the high-Arctic tundra."
    de: "Die Ringelgans ist eine kleine, gesellig lebende Art der Gattung Meergänse (Branta) der Familie der Entenvögel (Anatidae). Sie ist die kleinste und dunkelste der Meergänsearten, zu denen neben der Ringelgans die Nonnengans, die Rothalsgans, die Kanadagans, die Zwergkanadagans und die Hawaiigans zählen. Ihr Brutareal sind die arktische Kältewüste und arktische Tundra Eurasiens und Nordamerikas."
    sv: "Prutgås är en andfågel av släktet Branta i underfamiljen Anserinae. Den häckar i arktiska Nordamerika, Europa och Asien. Vintertid flyttar den till kusterna vid Atlanten, Nordsjön och Stilla havet."
