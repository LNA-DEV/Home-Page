    de: "Der Seeotter, Kalan oder Meerotter ist eine Raubtierart aus der Unterfamilie der Otter (Lutrinae). Er ist neben dem Küstenotter des Südpazifiks die einzige Otterart, die nur im Meer lebt. Seeotter gelten als intelligent und lernfähig, bekannt sind sie vor allem wegen des regelmäßigen Gebrauchs von Werkzeugen."
