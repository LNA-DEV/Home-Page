  description:
    en: "The black rhinoceros, also called the black rhino or the hooked-lip rhinoceros, is a species of rhinoceros native to East and Southern Africa, including Angola, Botswana, Eswatini, Kenya, Lesotho, Malawi, Mozambique, Namibia, South Africa, Tanzania, Zambia, and Zimbabwe. Although the species is referred to as black, its colours vary from brown to grey. It is the only extant species of the genus Diceros."
    de: "Das Spitzmaulnashorn, auch Spitzlippennashorn oder seltener Schwarzes Nashorn genannt, ist eine Säugetierart aus der Familie der Nashörner (Rhinocerotidae). Es ist neben dem etwas größeren Breitmaulnashorn eine der beiden Nashornarten des afrikanischen Kontinents. Die bis zu 1.400 Kilogramm schweren Tiere sind Bewohner der Savannen und offenen Landschaften und heute unter anderem in Ost- und Südafrika zu finden."
- slug: bengal-tiger
