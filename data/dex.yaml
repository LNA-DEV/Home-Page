    en: "The orca, or killer whale, is a toothed whale and the largest member of the oceanic dolphin family. The only extant species in the genus Orcinus, it is recognizable by its distinct pigmentation; being mostly black on top, white on the bottom and having recognizable white eye patches. A cosmopolitan species, it inhabits a wide range of marine environments, from Arctic to Antarctic regions to tropical seas, but is more commonly documented in temperate or cooler coastal waters."
    de: "Der (Große) Schwertwal, auch Orca, Killerwal, Mörderwal oder veraltet Butzkopf genannt, ist die größte heute vorkommende Art der Delfine. Schwertwale leben in allen Ozeanen, hauptsächlich in den Polargebieten."
