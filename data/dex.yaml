  description:
    en: "The Canada goose is a large species of goose with a black head and neck, white cheeks, white under its chin, and a brown body. It is native to the arctic and temperate regions of North America, and it is occasionally found during migration across the Atlantic in northern Europe. It has been introduced to France, the United Kingdom, Ireland, Scandinavia, New Zealand, Japan, Chile, Argentina, and the Falkland Islands."
    de: "Die Kanadagans ist eine Vogelart aus der Familie der Entenvögel (Anatidae) und gilt als die weltweit am häufigsten vorkommende Gans. Ihr ursprüngliches Verbreitungsgebiet ist Nordamerika. Sie ist dort ein Charaktervogel des Tieflandes und brütet an Binnenseen der Prärie- und Ackerbaugebiete."
