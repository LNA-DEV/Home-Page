    commons_file: Lynx lynx poing.jpg
    file: eurasian-lynx.jpg
  names:
    en: Eurasian Lynx
    de: Eurasischer Luchs
    sv: Lodjur
  description:
    en: "The Eurasian lynx is one of the four extant species within the medium-sized wild cat genus Lynx. It is widely distributed from Northern, Central and Eastern Europe to Central Asia and Siberia, the Tibetan Plateau and the Himalayas. It inhabits temperate and boreal forests up to an elevation of 5,500 m (18,000 ft)."
    de: "Der Eurasische Luchs oder Nordluchs ist eine in Eurasien verbreitete Art der Luchse. Im deutschen Sprachgebrauch ist mit Luchs fast immer diese Art gemeint. Nach Braunbär, Wolf und Persischem Leoparden und noch vor dem Vielfraß ist diese Katze das viertgrößte in Europa heimische Landraubtier."
