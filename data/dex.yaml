    en: "The rock dove, also known as the common pigeon or rock pigeon, is a member of the bird family Columbidae. In common usage, it is often simply referred to as the \"pigeon\", although the rock dove is the wild form of the bird; the pigeons familiar to most people are the domesticated forms of the wild rock dove."
    de: "Die Felsentaube ist eine Vogelart aus der Familie der Tauben (Columbidae). Sie ist die alleinige Stammform der Haustaube und damit auch der Stadttaube. Diese domestizierte und verwilderte Form zählt zu den erfolgreichsten Vögeln der Erde und ist mittlerweile, von der Arktis und Antarktis abgesehen, weltweit verbreitet."
