    en: "The mountain gorilla is one of the two subspecies of the eastern gorilla. It is listed as endangered by the IUCN as of 2018."
    de: "Der Berggorilla ist eine Unterart des Östlichen Gorillas aus der Primatenfamilie der Menschenaffen (Hominidae). Von allen Gorillas stellt er die am ausgeprägtesten auf dem Boden lebende und sich am meisten von Blättern ernährende Population dar. Berggorillas bewohnen zwei kleine Gebiete im östlichen Afrika, das Gebiet der Virunga-Vulkane und den Bwindi-Wald, wobei die Population des Bwindiwaldes möglicherweise eine vom Berggorilla zu unterscheidende Unterart („Bwindigorilla“) darstellt."
