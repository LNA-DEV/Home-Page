  description:
    en: "The brown bear is a large bear native to Eurasia and North America. Of the land carnivorans, it is rivaled in size only by its closest relative, the polar bear, which is much less variable in size and slightly bigger on average. The brown bear is a sexually dimorphic species, as adult males are larger and more compactly built than females."
    de: "Der Braunbär gehört zu den Säugetieren aus der Familie der Bären (Ursidae). In Eurasien und Nordamerika kommt er in mehreren Unterarten vor, darunter Europäischer Braunbär, Grizzlybär und Kodiakbär."
- slug: wild-boar
