    sv: "Kejsarpingvin är den största och tyngsta nu levande pingvinarten och är endemisk för Antarktis. Hanen och honan är lika såväl till fjäderdräkt som storlek, vilken uppgår till cirka 120 centimeter. De väger i genomsnitt mellan 22 och 37 kg."
