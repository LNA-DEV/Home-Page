  description:
    en: "The common buzzard is a medium-to-large bird of prey which has a large range. It is a member of the genus Buteo in the family Accipitridae. The species lives in most of Europe and extends its breeding range across much of the Palearctic as far as northwestern China, far western Siberia and northwestern Mongolia."
    de: "Der Mäusebussard ist ein Greifvogel aus der Familie der Habichtartigen und der häufigste Vertreter dieser Familie in Mitteleuropa. Er ist mittelgroß und kompakt, das Gefieder variiert von Dunkelbraun bis fast Weiß. Er kann oft bei seinen kreisenden Segelflügen oder bei der Ansitzjagd beobachtet werden."
    sv: "Ormvråk är en medelstor hökfågel som häckar i palearktiska regionen och är den dominerande vråkarten i stora delar av Europa och västra Asien. I Europa är den vanligen stannfågel, men bestånd i Skandinavien och Finland liksom östligare fåglar flyttar vintertid söderut. Den häckar i skogar eller dungar intill öppna områden och ses ofta kretsa högt eller sittande utmed vägar på jakt efter byten som smågnagare, fågelungar, reptiler, groddjur och till och med daggmask."
  description_source:
