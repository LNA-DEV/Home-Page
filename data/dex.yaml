    commons_file: "Wildschwein, Nähe Pulverstampftor.jpg"
  names:
    en: Wild Boar
    de: Wildschwein
    sv: Vildsvin
  description:
    en: "The wild boar, also known as the wild swine, common wild pig, Eurasian wild pig, or simply wild pig, is a suid native to much of Eurasia and North Africa, and has been introduced to the Americas and Oceania. The species is now one of the widest-ranging mammals in the world, as well as the most widespread suiform. It has been assessed as least concern on the IUCN Red List due to its wide range, high numbers, and adaptability to a diversity of habitats."
    de: "Das Wildschwein, jägersprachlich Schwarzwild genannt, ist ein Paarhufer in der Familie der Echten Schweine und die Stammform des Hausschweins. Das ursprüngliche Verbreitungsgebiet reicht von Westeuropa bis Südostasien. Durch Aussetzen in Nord- und Südamerika, Australien sowie auf zahlreichen Inseln ist es heute nahezu weltweit verbreitet."
