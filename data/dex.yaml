    de: "Der Sperlingskauz ist die kleinste in Mitteleuropa heimische Eule. Auch weltweit gehört die Art zu den Zwergen unter den Eulenvögeln. Der Sperlingskauz ist ein Bewohner des paläarktischen Nadelwaldgürtels, in Mitteleuropa waren seine Vorkommen lange Zeit auf montane Wälder und Wälder in Mittelgebirgslagen beschränkt."
    sv: "Sparvuggla är en mycket liten uggla som förekommer i Europa och norra Asien. Den häckar i barr- och blandskogar och livnär sig på småfåglar och smågnagare. IUCN kategoriserar den som livskraftig (LC)."
