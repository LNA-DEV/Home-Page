  description:
    en: "The short-toed treecreeper is a small passerine bird found in woodlands through much of the warmer regions of Europe and into north Africa. It has a generally more southerly distribution than the other European treecreeper species, the common treecreeper, with which it is easily confused where they both occur. The short-toed treecreeper tends to prefer deciduous trees and lower altitudes than its relative in these overlap areas."
    de: "Der Gartenbaumläufer ist eine Vogelart aus der Gattung der Baumläufer (Certhia). Er ist in weiten Teilen Mitteleuropas ein verbreiteter Brutvogel, der vor allem im Tiefland anzutreffen ist."
