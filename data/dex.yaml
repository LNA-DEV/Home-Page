  description:
    en: "The mandarin duck is a perching duck species native to the East Palearctic. It is sexually dimorphic; the males are elaborately coloured, while the females have more subdued colours. It is a medium-sized duck, at 41–49 cm (16–19 in) long with a 65–75 cm (26–30 in) wingspan."
    de: "Die Mandarinente ist eine ursprünglich in Ostasien beheimatete Vogelart aus der Familie der Entenvögel (Anatidae). Sie gehört wie die Brautente zur Gattung Aix. In Europa gibt es vereinzelt verwilderte Parkpopulationen, die aus Gefangenschaftsflüchtlingen entstanden sind."
