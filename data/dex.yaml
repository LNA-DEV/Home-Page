    en: "The American bison, commonly known as the American buffalo, or simply buffalo, is a species of bison that is endemic to North America. It is one of two extant species of bison, along with the European bison."
    de: "Der Amerikanische Bison, oft auch als Büffel bezeichnet, ist ein in Nordamerika verbreitetes Wildrind und zugleich das größte Landsäugetier der Region. Ob er zusammen mit dem in Europa vorkommenden, ihm ähnlichen Wisent eine eigene Gattung der Bisons (Bison) bildet, ist in der Forschung umstritten. Heute werden beide aber häufig zu den Eigentlichen Rindern (Bos) gestellt."
