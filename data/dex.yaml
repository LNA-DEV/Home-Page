    en: "The saltwater crocodile is a crocodilian native to saltwater habitats, brackish wetlands and freshwater rivers from India's east coast across Southeast Asia and the Sundaland to northern Australia and Micronesia. It has been listed as Least Concern on the IUCN Red List since 1996. It was hunted for its skin throughout its range up to the 1970s, and is threatened by illegal killing and habitat loss."
    de: "Das Leistenkrokodil, auch Salzwasserkrokodil genannt, ist das größte heute lebende Krokodil, gefolgt vom Nilkrokodil. Es handelt sich dabei um eine Art der Echten Krokodile (Crocodylidae). Wie auch die Spitzkrokodile können Leistenkrokodile sowohl im Salz- als auch im Süßwasser leben."
