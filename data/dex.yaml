  names:
    en: Musk Ox
    de: Moschusochse
    sv: Myskoxe
  description:
    en: "The muskox is a hoofed mammal of the family Bovidae. Native to the Arctic, it is noted for its thick coat and for the strong odor emitted by males during the seasonal rut, from which its name derives. This musky odor has the effect of attracting females during mating season."
    de: "Der Moschusochse, auch als Bisamochse oder Schafsochse bezeichnet, ist ein Paarhufer aus der Unterfamilie der Antilopinae; innerhalb derer gehört er in die Verwandtschaftsgruppe der Ziegenartigen (Caprini). Die bis zu 1,50 m hohen männlichen und bis zu 1,30 m hohen weiblichen Tiere sind Bewohner der arktischen Tundren und heute ursprünglich nur noch in Grönland und Kanada zu finden."
- slug: european-badger
