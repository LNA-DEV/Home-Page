  description:
    en: "The greylag goose is a species of large goose in the waterfowl family Anatidae and the type species of the genus Anser. It has mottled and barred grey and white plumage and an orange beak and pink legs. A large bird, it measures between 74 and 91 centimetres in length, with an average weight of 3.3 kilograms."
    de: "Die Graugans, häufig kurz Gans genannt, ist eine Art der Gattung Feldgänse (Anser) in der Familie der Entenvögel (Anatidae). Graugänse zählen zu den häufigsten Wasservögeln und sind, nach der Kanadagans, die zweitgrößte Gänseart in Europa. Sie sind die wilden Vorfahren der domestizierten Hausgänse."
