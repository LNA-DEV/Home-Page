    de: "Der Eurasische Luchs oder Nordluchs ist eine in Eurasien verbreitete Art der Luchse. Im deutschen Sprachgebrauch ist mit Luchs fast immer diese Art gemeint. Nach Braunbär, Wolf und Persischem Leoparden und noch vor dem Vielfraß ist diese Katze das viertgrößte in Europa heimische Landraubtier."
    sv: "Lo, lodjur eller lokatt, i västra Sverige även göpe eller göpa med flera, är ett kattdjur som förekommer i Europa och Asien. Lodjuret är Europas största kattdjur och fanns en gång i skogar över stora delar av den europeiska kontinenten och vidare österut till Sibirien. På Iberiska halvön förekommer istället den närbesläktade panterlon."
