    de: "Der Steinadler ist eine große Greifvogelart innerhalb der Familie der Habichtartigen (Accipitridae). Steinadler besiedeln offene und halboffene Landschaften in der gesamten Holarktis. Sie ernähren sich meist von mittelgroßen, bodenbewohnenden Säugern."
    sv: "Kungsörn är en rovfågel som tillhör familjen Accipitridae, och som förekommer på norra halvklotet i Eurasien, Nordamerika och delar av Afrika. Som hos många rovfåglar är honorna större än hanarna. Den adulta kungsörnen varierar från svartbrun till mörkt brun med en guldbrun hjässa och nacke."
