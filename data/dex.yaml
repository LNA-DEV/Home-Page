    sv: "Isbjörn är en köttätande björn. Den lever i arktiska områden, vilket omfattar Norra ishavet, dess omgivande hav och landmassor. Isbjörn är tillsammans med brunbjörnens underart kodiakbjörnen den största björnen inom familjen."
