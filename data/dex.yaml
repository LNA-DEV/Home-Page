    de: "Der Ozelot ist eine in Mittel- und Südamerika lebende Raubtierart aus der Familie der Katzen (Felidae). Er ist der größte und wohl bekannteste Vertreter der Pardelkatzen (Leopardus), einer auf Amerika beschränkten Gattung kleinerer, gefleckter Katzen."
