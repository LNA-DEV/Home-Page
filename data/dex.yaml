    en: "The European turtle dove is a threatened or vulnerable member of the bird family Columbidae, the doves and pigeons. It breeds over a wide area of the south western Palearctic including north Africa but migrates to northern sub-Saharan Africa to winter."
    de: "Die Turteltaube ist eine Vogelart aus der Familie der Tauben. Das Verbreitungsgebiet umfasst weite Teile der westlichen und zentralen Paläarktis und reicht vom nördlichen Afrika, der iberischen Halbinsel und Großbritannien nach Osten über den Nahen und Mittleren Osten bis Nordwestchina und in die Mongolei. Im Mittelmeerraum ist die Turteltaube besonders häufig."
