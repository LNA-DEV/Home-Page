  description:
    en: "The Eurasian sparrowhawk, also known as the northern sparrowhawk or simply the sparrowhawk, is a small bird of prey in the family Accipitridae. Adult male Eurasian sparrowhawks have bluish grey upperparts and orange-barred underparts; females and juveniles are brown above with brown barring below. The female is up to 25% larger than the male – one of the greatest size differences between the sexes in any bird species."
    de: "Der Sperber ist ein Greifvogel und gehört zur Familie der Habichtartigen (Accipitridae). Die Weibchen sind deutlich größer als die Männchen und fast doppelt so schwer. In der Jägersprache werden die Männchen Sprinz genannt."
    sv: "Sparvhök är en liten rovfågel inom familjen hökar, som omfattar många andra dagaktiva rovfåglar med namn som örnar, vråkar, kärrhökar och andra hökar. Adulta sparvhökshanar har blågrå ovansida och orangestreckad undersida. Honor och juveniler är bruna på ovansidan och har brunstreckade undersidor."
