    en: "The long-eared owl, also known as the northern long-eared owl or, more informally, as the lesser horned owl or cat owl, is a medium-sized species of owl with an extensive breeding range. The genus name, Asio, is Latin for \"horned owl\", and the specific epithet, otus, is derived from Greek and refers to a small eared owl. The species breeds in many areas through Europe and the Palearctic, as well as in North America."
    de: "Die Waldohreule ist eine nachtaktive Greifvogelart, die zu den Eigentlichen Eulen (Strigidae) gehört. Sie zählt zur Gattung der Ohreulen und ist eine der häufigsten Eulen in Mitteleuropa. Die Namensgebung geht auf die beiden Federbüschel am Kopf zurück."
    sv: "Hornuggla är en fågel inom släktet Asio och familjen ugglor. Arten har en ovanligt stor utbredning och häckar i Europa, Asien och Nordamerika. Till största delen är den flyttfågel."
