  description:
    en: "The carrion crow is a passerine bird of the family Corvidae, native to western Europe and the eastern Palearctic. Along with the hooded crow, the carrion crow occupies a similar ecological niche in Eurasia to the American crow in North America. The two species look very similar to one another, but can be differentiated by size, as the carrion crow is larger and of a stockier build compared to the American crow."
    de: "Die Rabenkrähe ist eine Vogelart aus der Familie der Rabenvögel (Corvidae). Sie ist eng mit der grau-schwarzen Nebelkrähe verwandt, mit der sie sich auch verpaart. Beide Arten wurden früher als zwei Unterarten oder Morphen derselben Art aufgefasst, die traditionell als Aaskrähe bezeichnet wurde – eine Auffassung, die von einigen Autoren weiterhin vertreten wird."
    sv: "Kråka är en fågel i familjen kråkfåglar. Den är en vanligt förekommande fågel i Europa, Nordafrika och Asien österut till Japan. Världspopulationen anses vara livskraftig."
