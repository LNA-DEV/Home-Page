    de: "Der Axolotl ist ein in Mexiko rein aquatisch lebender Schwanzlurch aus der Familie der Querzahnmolche (Ambystomatidae), der natürlicherweise nur als Dauerlarve auftritt. Axolotl erreichen ihre Geschlechtsreife, ohne ihre äußere Larvengestalt zu verändern und eine bei Amphibien sonst übliche Metamorphose zu durchlaufen."
