    de: "Der Grizzlybär, seltener auch Graubär genannt, ist eine in Nordamerika lebende Unterart des Braunbären aus der Familie der Bären (Ursidae). Ging man in früherer Zeit noch von zahlreichen verschiedenen Unterarten auf diesem Kontinent aus, so werden heute in der Regel alle dort lebenden Braunbären mit Ausnahme der Kodiakbären als Grizzlybären bezeichnet."
