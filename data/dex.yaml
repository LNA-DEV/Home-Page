  description:
    en: "Cattle are large, domesticated, bovid ungulates widely kept as livestock. They are prominent modern members of the subfamily Bovinae and the most widespread species of the genus Bos."
    de: "Das Hausrind oder schlicht Rind ist die domestizierte Form des eurasischen Auerochsen. Es wurde zunächst wegen seines Fleisches, später auch wegen seiner Milch und Leistung als Zugtier domestiziert. Seitdem hat der Mensch eine Anzahl unterschiedlicher Rinderrassen gezüchtet, in die teilweise auch Wildrinder eingekreuzt wurden."
- slug: domestic-goat
