  description:
    en: "The grey seal, or gray seal in the United States, is a large seal of the family Phocidae, which are commonly referred to as \"true seals\" or \"earless seals\". The only species classified in the genus Halichoerus, it is found on both shores of the North Atlantic Ocean. In Latin, Halichoerus grypus means \"hook-nosed sea pig\"."
    de: "Die Kegelrobbe ist neben dem Seehund die zweite an deutschen Küsten verbreitete Robbenart und daneben das größte in Deutschland freilebend vorkommende Raubtier. Der Name leitet sich von den kegelförmigen Zähnen und der Kopfform der Robbe ab."
