    de: "Die Hausziege ist nach dem Hund und zusammen mit dem Schaf vermutlich eines der ersten wirtschaftlich genutzten Haustiere. Hausziegen gehören zur Gattung der Ziegen in der Familie der Hornträger."
- slug: domestic-cat
