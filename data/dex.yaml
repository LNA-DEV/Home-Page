    en: "The common bottlenose dolphin or Atlantic bottlenose dolphin is one of three species of bottlenose dolphin in the genus Tursiops. While formerly known simply as the bottlenose dolphin, this term is now applied to the genus Tursiops as a whole. As considerable genetic variation has been described within this species, even between neighboring populations, many experts think additional species may be recognized and split out."
    de: "Der Große Tümmler, in Abgrenzung zu anderen Arten der Gattung Tursiops neuerdings auch Gewöhnlicher Großer Tümmler, ist eine in allen Ozeanen verbreitete Art der Delfine. Es ist diese Art, die hauptsächlich in Delfinarien gehalten wird und durch die Serie Flipper bekannt wurde. Dadurch ist der Große Tümmler der bekannteste aller Delfine geworden."
