  description:
    en: "The barn swallow is the most widespread species of swallow in the world, occurring on all continents, with vagrants reported even in Antarctica. It is a distinctive passerine bird with blue upperparts and a long, deeply forked tail. In Anglophone Europe, it is just called the swallow; in northern Europe, it is the only member of family Hirundinidae called a \"swallow\" rather than a \"martin\"."
    de: "Die Rauchschwalbe, auch Hausschwalbe und Gabelschwalbe genannt, ist eine Vogelart aus der Familie der Schwalben (Hirundinidae). Sie ist ein Zugvogel."
