  description:
    en: "The roe deer, also known as the roe, western roe deer, or European roe, is a species of deer. The male of the species is sometimes referred to as a roebuck. The roe is a small deer, reddish and grey-brown, and well-adapted to cold environments."
    de: "Das Reh, zur Unterscheidung vom Sibirischen Reh auch Europäisches Reh genannt, ist die in Europa häufigste und kleinste Art der Hirsche. Als Trughirsch ist es näher mit dem Ren, dem Elch und dem amerikanischen Weißwedelhirsch verwandt als mit dem in Mitteleuropa ebenfalls heimischen Rothirsch."
- slug: european-bison
