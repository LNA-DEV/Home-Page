    en: "The alpine marmot is a large ground-dwelling squirrel, from the genus of marmots. It is found in high numbers in mountainous areas of central and southern Europe, at heights between 800 and 3,200 m (2,600–10,500 ft) in the Alps, Carpathians, Tatras and Northern Apennines. In 1948 they were reintroduced with success in the Pyrenees, where the alpine marmot had disappeared at end of the Pleistocene epoch."
    de: "Das Alpenmurmeltier, süddeutsch und österreichisch auch Mankei oder Murmel, in der Schweiz auch Mungg oder Murmunda, ist ein besonders in den Alpen verbreitetes Nagetier. Es ist nach dem Biber und dem Stachelschwein das drittgrößte in Europa vorkommende Nagetier. Jungtiere des Alpenmurmeltieres erreichen in der Regel im dritten Jahr ihre Geschlechtsreife und verlassen frühestens dann ihren Familienverband."
