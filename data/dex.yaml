    en: "The peregrine falcon, also referred to simply as the peregrine, is a bird of prey (raptor) in the family Falconidae known for its speed. A large, crow-sized falcon, it has a blue-grey back, barred white underparts and a black head. As is typical for bird-eating (avivore) raptors, peregrine falcons are sexually dimorphic, with females being considerably larger than males."
    de: "Der Wanderfalke gehört zur Familie der Falkenartigen. Er zählt zu den größten Vertretern der Familie und ist mit einer Spitzengeschwindigkeit von mehr als 320 km/h beim Jagdstoß das schnellste bekannte Tier. Der Wanderfalke ist ein Kosmopolit und die am weitesten verbreitete Vogelart der Welt."
