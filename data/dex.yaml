    de: "Der Amerikanische Schwarzbär, auch Baribal genannt, ist eine in Nordamerika lebende Raubtierart aus der Familie der Bären (Ursidae). In seiner Heimat wird er meistens als black bear oder Ours noir bezeichnet. Im Vergleich zum eher gefürchteten Grizzlybären gilt der Schwarzbär als weniger gefährlich."
