  description:
    en: "The Alpine chough or yellow-billed chough is a bird in the crow family, one of only two species in the genus Pyrrhocorax. Its two subspecies breed in high mountains from Spain eastwards through southern Europe and North Africa to Central Asia and Nepal, and it may nest at a higher altitude than any other bird. Its eggs have adaptations to the thin atmosphere that improve oxygen take-up and reduce water loss."
    de: "Die Alpendohle ist eine Vogelart aus der Familie der Rabenvögel (Corvidae). Der 34 bis 38 cm große Vogel ist ein mittelgroßer Vertreter seiner Familie und zeichnet sich durch schwarzes Gefieder, rote Beine und einen gelben Schnabel aus. Im Feld ist die Art daneben auch durch ihren akrobatischen Segelflug und ihre pfeifenden Rufe zu erkennen."
