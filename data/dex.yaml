    de: "Die Feldmaus ist ein Säugetier aus der Unterfamilie der Wühlmäuse (Arvicolinae). Sie ist als typischer r-Stratege eines der häufigsten Säugetiere Mitteleuropas und zeigt zyklische Massenvermehrungen."
    en: "A small grey-brown rodent of open grassland and farmland across Europe, with a blunt muzzle, short ears and a short tail. Numbers swing through multi-year boom and crash cycles, which makes it a staple prey of kestrels, owls and foxes."
