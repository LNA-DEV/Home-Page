  description:
    en: "The Arctic fox, also known as the white fox, polar fox, or snow fox, is a small species of fox native to the Arctic regions of the Northern Hemisphere and common throughout the Arctic tundra. It is well adapted to living in cold environments, and is known for its thick, warm fur that can be used as camouflage against snow in the winter. It has a large and fluffy tail."
    de: "Der Polarfuchs, Schneefuchs oder Eisfuchs ist eine Fuchsart, die in der nördlichen Polarregion beheimatet ist."
