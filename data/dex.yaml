    en: "The tree sparrow is a passerine bird in the sparrow family with a rich chestnut crown and nape and a black patch on each pure white cheek. The sexes have similar plumage, and young birds are duller versions of the adult. This sparrow breeds across much of temperate Eurasia and Southeast Asia and has been introduced elsewhere, including the United States, where it is known as the Eurasian tree sparrow or German sparrow to differentiate it from the native American tree sparrow."
