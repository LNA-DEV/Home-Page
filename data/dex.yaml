  description:
    en: "The common nightingale, rufous nightingale or simply nightingale, is a small passerine bird which is best known for its powerful and beautiful song. An Old World flycatcher, it belongs to a group of more terrestrial species, often called chats. Its range partly overlaps with that of the more northerly thrush nightingale, a closely related species with which hybrids have occurred."
    de: "Die Nachtigall ist eine Vogelart aus der Ordnung der Sperlingsvögel (Passeriformes), Unterordnung Singvögel (Passeres). Nach neueren molekularbiologischen Erkenntnissen zur Phylogenese der Singvögel wird sie heute meist zur Familie der Fliegenschnäpper (Muscicapidae) gestellt. Manchmal findet man sie aber auch heute noch bei den Drosseln (Turdidae) eingeordnet."
