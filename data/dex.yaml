    sv: Gems
  description:
    en: "The chamois, or Alpine chamois, is a species of goat-antelope native to mountainous parts of Europe and Western Asia, from the Pyrenees, the Alps, the Apennines, the Dinarides, the Tatra to the Carpathian Mountains, the Balkan Mountains, the Rila–Rhodope massif, Pindus, the northeastern mountains of Turkey, and the Caucasus. It has also been introduced to the South Island of New Zealand. Some subspecies of chamois are strictly protected in the EU under the European Habitats Directive."
    de: "Die (Alpen-)Gämse, vor der Rechtschreibreform Gemse geschrieben und in der Jägersprache mit Gams oder Gamswild bezeichnet, ist eine in Europa und Kleinasien beheimatete Art der Ziegenartigen. Zusammen mit der Pyrenäen-Gämse und weiteren Arten gehört sie zur Gattung der Gämsen (Rupicapra)."
