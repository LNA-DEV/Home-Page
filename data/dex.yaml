    de: "Als Galapagos-Riesenschildkröten werden 15 auf den verschiedenen Galapagosinseln endemisch vorkommende Schildkrötenarten bezeichnet. Die Galapagos-Riesenschildkröten sind kein eigenständiges Taxon, sondern bilden mit einigen Schildkrötenarten des südamerikanischen Festlands die Gattung Chelonoidis in der Familie der Landschildkröten (Testudinidae). Vier Arten der Galapagos-Riesenschildkröten gelten als ausgerottet."
