  description:
    en: "The little owl, also known as the owl of Athena or owl of Minerva, is a bird that inhabits much of the temperate and warmer parts of Europe, the Palearctic east to Korea, and North Africa. It was introduced into Britain at the end of the 19th century and into the South Island of New Zealand in the early 20th century."
    de: "Der Steinkauz ist eine kleine, kurzschwänzige Eulenart aus der Familie der Eigentlichen Eulen (Strigidae). Das Verbreitungsgebiet des Steinkauzes erstreckt sich über Eurasien und Nordafrika. Er ist ein charakteristischer Bewohner der Baumsteppe mit spärlicher oder niedriger Vegetation und jagt bevorzugt auf dem Boden."
