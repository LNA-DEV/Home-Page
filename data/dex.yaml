    sv: "Sädesärla är en liten, slank, svartvit ärla med lång stjärt som den ofta vickar på. Den häckar i större delen av Europa och Asien, delar av norra Afrika samt i Alaska. Den är en stannfågel i de mildaste områdena av utbredningsområdet, men är i övrigt en flyttfågel som övervintrar i Afrika."
