    de: "Die Mandarinente ist eine ursprünglich in Ostasien beheimatete Vogelart aus der Familie der Entenvögel (Anatidae). Sie gehört wie die Brautente zur Gattung Aix. In Europa gibt es vereinzelt verwilderte Parkpopulationen, die aus Gefangenschaftsflüchtlingen entstanden sind."
