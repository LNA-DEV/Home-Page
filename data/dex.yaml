    en: "The monarch butterfly or simply monarch is a milkweed butterfly in the family Nymphalidae. Other common names, depending on region, include milkweed, common tiger, wanderer, and black-veined brown. It is among the most familiar of North American butterflies and an iconic pollinator, although it is not an especially effective pollinator of milkweeds."
    de: "Der Monarchfalter oder Amerikanische Monarch ist ein auffällig orange und schwarz gezeichneter Schmetterling (Tagfalter) aus der Familie der Edelfalter (Nymphalidae). Er ist in Amerika weit verbreitet und hat sich im 18. Jahrhundert über den Südpazifik bis nach Australien ausgebreitet."
