    de: "Der Eisbär, auch Polarbär genannt, ist eine Raubtierart aus der Familie der Bären (Ursidae). Er lebt an den Küsten und auf dem Eis in den nördlichen Polarregionen und ist eng mit dem Braunbären verwandt. Neben Kamtschatkabären und Kodiakbären gelten Eisbären als die größten an Land lebenden Raubtiere der Erde."
