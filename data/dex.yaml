    en: "The European pine marten, also known as the pine marten, is a mustelid native to and widespread in most of Europe, Asia Minor, the Caucasus, and parts of Iran, Iraq, and Syria. It is listed as Least Concern on the IUCN Red List. It is less commonly known as baum marten or sweet marten."
    de: "Der Baummarder oder Edelmarder ist eine Art der echten Marder (Mustelidae) innerhalb der Raubtiere (Carnivora). Er lebt in Europa sowie Klein- und Nordasien und ist ein Waldbewohner. Anders als sein Verwandter, der Steinmarder, folgt der Baummarder dem Menschen nicht in die Nähe der Siedlungen."
