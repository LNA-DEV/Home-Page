    de: "Der Kaiserpinguin ist die größte Art aus der Familie der Pinguine (Spheniscidae) und zählt zusammen mit dem Königspinguin zur Gattung der Großpinguine (Aptenodytes). Es werden keine Unterarten für den Kaiserpinguin anerkannt. Auf Grund zahlreicher Infotainment- und Dokumentarfilme zählt der Kaiserpinguin zu den bekanntesten Pinguinarten."
