    de: "Der Schneehase ist eine zur Familie der Hasen (Leporidae) gehörige Art. In Europa gehört er zur Wirbeltierfauna der Alpen und ist gemeinsam mit dem Alpenschneehuhn eine der wenigen Tierarten, die an den boreo-alpinen Lebensraum gut angepasst sind. Die Deutsche Wildtier Stiftung wählte den Alpenschneehasen zum Tier des Jahres 2025."
