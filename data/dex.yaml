    sv: "Större hackspett är en fågelart inom familjen hackspettar (Picidae). Den förekommer i Europa, norra Afrika och norra Asien. Merparten av världspopulationen är stannfåglar, förutom de som häckar i den kallaste nordligaste delarna av utbredningsområdet."
