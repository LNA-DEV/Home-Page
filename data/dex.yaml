  description:
    en: "The western jackdaw, also known as the Eurasian jackdaw, the European jackdaw, or simply the jackdaw, is a passerine bird in the crow family. It is found across Europe, western Asia and western North Africa; it is mostly resident, although northern and eastern populations migrate south in the winter. Four subspecies are recognised, which differ mainly in the darker or paler greyscale of the plumage on the head and nape."
    de: "Die Dohle, auch Turmkrähe genannt, ist eine Singvogelart aus der Familie der Rabenvögel (Corvidae). Sie ist eine von zwei Arten der Untergattung der Dohlen. Im Vergleich zu den eng verwandten Arten der Raben und Krähen (Corvus) ist sie ein eher kleiner Vertreter der Rabenvögel."
