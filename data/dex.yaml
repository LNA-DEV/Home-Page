  description:
    en: "Sheep or domestic sheep are a domesticated ruminant mammal typically kept as livestock. Although the term sheep can apply to other species in the genus Ovis, in everyday usage it almost always refers to domesticated sheep. Like all ruminants, sheep are members of the order Artiodactyla, the even-toed ungulates."
    de: "Das Hausschaf, kurz auch Schaf, ist die domestizierte Form des Mufflons. Es spielt in der Geschichte der Menschheit eine bedeutende Rolle als Milch-, Lammfleisch- beziehungsweise Hammelfleisch-, Woll- und Schaffelllieferant."
