    en: "The reindeer or caribou is a species of deer with circumpolar distribution, native to Arctic, subarctic, tundra, boreal, and mountainous regions of Northern Europe, Siberia, and North America. It is the only representative of the genus Rangifer. More recent studies suggest the splitting of reindeer and caribou."
    de: "Das Ren [reːn], [rɛn] oder Rentier [ˈreːnˌtiːɐ], [ˈrɛnˌtiːɐ] ist eine Säugetierart aus der Familie der Hirsche (Cervidae). Es lebt zirkumpolar im Sommer in den Tundren und im Winter in der Taiga Nordeurasiens und Nordamerikas sowie auf Grönland und anderen arktischen Inseln. Es ist die einzige Hirschart, die domestiziert wurde."
