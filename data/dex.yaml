    en: "The white-tailed eagle, sometimes known as the \"sea eagle\", is a large bird of prey, widely distributed across temperate Eurasia. Like all eagles, it is a member of the family Accipitridae which also includes other diurnal raptors such as hawks, kites, and harriers. One of up to eleven members in the genus Haliaeetus, which are commonly called sea eagles, it is also referred to as the white-tailed sea-eagle."
    de: "Der Seeadler ist ein Greifvogel aus der Familie der Habichtartigen (Accipitridae). Seeadler bewohnen gewässerreiche Landschaften Eurasiens von Grönland bis zum Pazifik. Sie ernähren sich überwiegend von Fischen, Wasservögeln und Aas."
