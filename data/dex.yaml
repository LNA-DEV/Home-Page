    de: "Der Fischadler ist eine Vogelart aus der Ordnung der Greifvögel (Accipitriformes). Aufgrund zahlreicher besonderer Merkmale wird die Art meist in eine eigene Familie Pandionidae gestellt, diese Familie und die Gattung Pandion sind damit monotypisch. Der Fischadler ist somit nicht näher verwandt mit den Echten Adlern und den anderen als „Adler“ bezeichneten großen Greifvögeln, die alle zur artenreichen Familie der Habichtartigen gehören."
    sv: "Fiskgjuse är en hökfågel i familjen fiskgjusar (Pandionidae). Den lever uteslutande av fisk som den tar i vattenytan. Fiskgjusen är en av världens mest spridda hökfåglar."
