  description:
    en: "The common starling, also known simply as the starling in Great Britain and Ireland, and as the European starling in North America, is a medium-sized passerine bird in the starling family, Sturnidae. It is about 20 cm (8 in) long and has glossy black plumage with a metallic sheen, which is speckled with white at some times of the year. The legs are pink and the bill is black in winter and yellow in summer; young birds have browner plumage than the adults."
    de: "Der Star, auch als Gemeiner Star bezeichnet, ist der in Eurasien am weitesten verbreitete und häufigste Vertreter der Familie der Stare (Sturnidae). Durch zahlreiche Einbürgerungen auf anderen Kontinenten ist der Star heute einer der häufigsten Vögel der Welt. Im Niederdeutschen werden Stare Spreen genannt."
    sv: "Stare är i Europa den vanligaste och mest utbredda företrädaren för familjen starar (Sturnidae). För en ovan betraktare kan den förväxlas med koltrasten, eftersom denna är en annan vanlig gulnäbbad mörk fågel som ses öppet på gräsmattor och inne i samhällen och städer. Staren är dock mindre, har spetsiga vingar och i sommardräkt en metalliskt blänkande fjäderdräkt."
  description_source:
    en: "https://en.wikipedia.org/wiki/Common_starling"
    de: "https://de.wikipedia.org/wiki/Star_(Art)"
    sv: "https://sv.wikipedia.org/wiki/Stare"
