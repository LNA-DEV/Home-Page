    de: "Wälder, Moorland, Grasland"
  reference:
    credit: Lviatour, CC BY-SA 3.0, Wikimedia Commons
    credit_url: "https://commons.wikimedia.org/wiki/File:Cervus_elaphus_Luc_Viatour_6.jpg"
    commons_file: Cervus elaphus Luc Viatour 6.jpg
    file: red-deer.jpg
  names:
    en: Red Deer
    de: Rothirsch
    sv: Kronhjort
  description:
    en: "One of the largest deer species and a keystone herbivore across Eurasia. Males grow and shed impressive antlers annually, using them in dramatic rutting contests each autumn. Important for ecosystem management through grazing."
    de: "Eine der größten Hirscharten und ein Schlüssel-Pflanzenfresser in Eurasien. Männchen wachsen und werfen jährlich beeindruckende Geweihe ab, die sie in dramatischen Brunftkämpfen im Herbst einsetzen. Wichtig für das Ökosystem- Management durch Beweidung."
  tips:
    best_time:
      en: "Autumn rut (Sep–Oct) for stags roaring. Dawn in open glens."
      de: "Herbstbrunft (Sep–Okt) für röhrende Hirsche. Morgengrauen in offenen Tälern."
    approach:
      en: "During the rut, stags are vocal and distracted — approach slowly using terrain for cover. A 400mm+ lens lets you keep a safe distance. Stay low and avoid skylining yourself on ridges. Outside the rut, deer are more skittish. Forest populations are harder than open moorland. Richmond Park (London) has very habituated herds for easy close-ups."
      de: "Während der Brunft sind Hirsche laut und abgelenkt — langsam annähern und das Gelände als Deckung nutzen. Ein 400mm+ Objektiv ermöglicht sicheren Abstand. Niedrig bleiben und nicht auf Bergkämmen Silhouette zeigen. Außerhalb der Brunft sind Hirsche scheuer. Waldpopulationen sind schwieriger als offenes Moorland. Richmond Park (London) hat sehr zahme Herden für einfache Nahaufnahmen."
