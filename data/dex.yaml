    de: "Der Steinkauz ist eine kleine, kurzschwänzige Eulenart aus der Familie der Eigentlichen Eulen (Strigidae). Das Verbreitungsgebiet des Steinkauzes erstreckt sich über Eurasien und Nordafrika. Er ist ein charakteristischer Bewohner der Baumsteppe mit spärlicher oder niedriger Vegetation und jagt bevorzugt auf dem Boden."
