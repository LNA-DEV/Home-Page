  description:
    en: "The moose or elk is the world's tallest, largest and heaviest extant species of deer and the only extant species in the genus Alces. It is also the tallest, and the second-largest, land animal in North America, falling short only to the American bison in body mass. Most adult male moose have broad, palmate antlers; other members of the deer family have pointed antlers with a dendritic (\"twig-like\") configuration."
    de: "Der Elch ist die größte heute vorkommende Art der Hirsche. Sein Lebensraum erstreckt sich über Nordeuropa, Nordasien und Nordamerika. Der Elch wird von der IUCN als „nicht gefährdet“ eingestuft."
