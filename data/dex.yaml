    de: "Der Nordstreifenkiwi, auch Nördlicher Streifenkiwi, Brauner Kiwi oder Nordkiwi, ist eine große Kiwiart. Auf der neuseeländischen Nordinsel und auf vorgelagerten Inseln Neuseelands beheimatet, ist er zwar eine der häufigeren Kiwi-Arten, durch den Jagddruck von Weißen eingeschleppter Raubtiere aber dennoch vielerorts selten geworden oder gar ausgerottet."
