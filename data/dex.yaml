  description:
    en: "The cougar, also called puma, mountain lion, catamount, and panther, is a large small cat native to the Americas. It inhabits North, Central and South America, making it the most widely distributed wild, terrestrial mammal in the Western Hemisphere, and one of the most widespread in the world. Its range spans Yukon, British Columbia and Alberta in Canada, the Rocky Mountains and areas in the western United States."
    de: "Der Puma ist nach dem Jaguar die zweitgrößte Art der Katzen (Felidae) in Amerika. Unter den Kleinkatzen wird sie als deren größte Art weltweit angesehen. Der Puma ist in weiten Teilen Nord-, Mittel- und Südamerikas verbreitet und dort unter zahlreichen weiteren Namen bekannt; für viele davon gibt es auch im Deutschen eine Entsprechung: Silberlöwe, Berglöwe oder Kuguar."
