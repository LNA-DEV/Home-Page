  description:
    en: "The tawny owl, also called the brown owl, is a stocky, medium-sized owl in the family Strigidae. It is commonly found in woodlands across Europe, as well as western Siberia, and has seven recognized subspecies. The tawny owl's underparts are pale with dark streaks, whilst its upper body may be either brown or grey."
    de: "Der Waldkauz ist eine mittelgroße Eulenart mit einer Verbreitung von Europa bis nach Westsibirien und in den Iran. Er kommt außerdem in Südostasien vor. In Mitteleuropa ist der Waldkauz gemeinsam mit der Waldohreule die häufigste Eule."
    sv: "Kattuggla är en kompakt, medelstor uggla som tillhör familjen ugglor och är vanlig i skogar över stora delar av Eurasien. Dess undersida är blek med mörka strimmor och ovansidan är antingen brun eller grå, och flera av de elva erkända underarterna uppvisar båda dessa färgvarianter. Boet är vanligen placerat i en trädhåla och ägg och ungar försvaras våldsamt mot potentiella predatorer."
