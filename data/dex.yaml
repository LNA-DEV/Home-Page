  description:
    en: "The rook is a member of the family Corvidae in the passerine order of birds. It is found in the Palearctic, its range extending from Scandinavia and western Europe to eastern Siberia. It is a large, gregarious, black-feathered bird, distinguished from similar species by the whitish featherless area on the face."
    de: "Die Saatkrähe ist eine der vier europäischen Arten der Gattung Corvus aus der Familie der Rabenvögel (Corvidae)."
