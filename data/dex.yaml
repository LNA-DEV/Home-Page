  description:
    en: "The goldcrest is a very small passerine bird in the kinglet family. Its colourful golden crest feathers, as well as being called the \"king of the birds\" in European folklore, gives rise to its English and scientific names. The scientific name, R."
    de: "Das Wintergoldhähnchen ist eine der kleinsten Vogelarten Europas. Mit seinen etwa 9 Zentimetern Körpergröße wiegt es nur zwischen 4 und 7 Gramm. Es ist leicht mit dem Sommergoldhähnchen zu verwechseln, das aber anders als das Wintergoldhähnchen einen weißen Überaugenstreifen und leuchtend gelbgrüne Halsseiten besitzt."
