  description:
    en: "The African bush elephant, also known as the African savanna elephant, is a species of elephant native to sub-Saharan Africa. It is one of three extant elephant species and, along with the African forest elephant, one of two extant species of African elephant."
    de: "Der Afrikanische Elefant, auch Afrikanischer Savannenelefant, Afrikanischer Steppenelefant oder Afrikanischer Buschelefant, ist eine Säugetierart aus der Familie der Elefanten. Er ist das größte rezente landbewohnende Tier der Erde. Herausragende Kennzeichen sind neben den Stoßzähnen und dem markanten Rüssel die großen Ohren und die säulenförmigen Beine."
