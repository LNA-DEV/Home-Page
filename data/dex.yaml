    sv: "Snöleopard"
  description:
    en: "The snow leopard is a species of large cat in the genus Panthera of the family Felidae. It is native to the mountain ranges of Central and South Asia, ranging from eastern Afghanistan, the Himalayas and the Tibetan Plateau to southern Siberia, Mongolia and Western China. It inhabits alpine and subalpine zones at elevations of 3,000–4,500 m (9,800–14,800 ft), but also lives at lower elevations in the northern part of its range."
    de: "Der Schneeleopard, Irbis oder Unze ist eine Großkatze (Pantherinae) der zentralasiatischen Hochgebirge. Man findet ihn vom Himalaya Nepals und Indiens im Süden bis zum Altai- und Sajangebirge Russlands im Norden sowie vom tibetischen Hochland im Osten bis zum Pamir, Hindukusch und Tianshan-Gebirge im Westen. Er sieht einem Leoparden ähnlich, hat aber ein längeres, meist graues Fell, das in der kalten Jahreszeit besonders dick ist."
