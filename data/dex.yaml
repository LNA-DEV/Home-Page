  description:
    en: "The red panda, also known as the lesser panda, is a small mammal native to the eastern Himalayas and southwestern China. It has dense reddish-brown fur with a black belly and legs, white-lined ears, a mostly white muzzle and a ringed tail. Its head-to-body length is 51–63.5 cm (20.1–25.0 in) with a 28–48.5 cm (11.0–19.1 in) tail, and it weighs between 3.2 and 15 kg."
    de: "Der Westliche Kleine Panda, auch Himalaja-Katzenbär genannt, ist ein mittelgroßes Säugetier aus der Gattung der Kleinen bzw. Roten Pandas (Ailurus), das in Nepal, im nordöstlichen Indien und in Bhutan sowie im südöstlichen Tibet vorkommt."
