  description:
    en: "The western house martin, sometimes called the common house martin, northern house martin or, particularly in Europe, just house martin, is a migratory passerine bird of the swallow family which breeds in Europe, north Africa and west-central Asia; and winters in sub-Saharan Africa and southwestern Asia. It feeds on insects which are caught in flight, and it migrates to climates where flying insects are plentiful."
    de: "Die Mehlschwalbe, auch Stadtschwalbe und Kirchschwalbe genannt, ist eine Vogelart aus der Familie der Schwalben (Hirundinidae). Sie ist neben Ufer-, Rauch- und Felsenschwalbe die vierte Art dieser Familie, die in Mitteleuropa als Brutvogel vorkommt. Sie ist besonders gut durch den weißen Bürzel zu identifizieren, den keine andere europäische Schwalbenart zeigt."
