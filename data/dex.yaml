  description:
    en: "The grey partridge is a bird in the pheasant family Phasianidae of the order Galliformes, gallinaceous birds. The scientific name is the Latin for \"partridge\"."
    de: "Das Rebhuhn ist eine bodenbrütende Vogelart aus der Ordnung der Hühnervögel (Galliformes). Rebhühner bewohnen Steppen- und Heidelandschaften in weiten Teilen Europas und Asiens. Sie ernähren sich überwiegend von Sämereien, Wildkräutern und Getreidekörnern."
