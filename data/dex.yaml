  description:
    en: "The platypus, sometimes referred to as the duck-billed platypus, is a semiaquatic, egg-laying mammal endemic to eastern Australia, including Tasmania. The platypus is the sole living representative of its family Ornithorhynchidae and genus Ornithorhynchus, though a number of related species appear in the fossil record. Together with the four species of echidna, it is one of the five extant species of monotremes, mammals that lay eggs instead of giving birth to live young."
    de: "Das Schnabeltier ist ein eierlegendes Säugetier aus Australien. Es ist die einzige lebende Art der Familie der Schnabeltiere (Ornithorhynchidae). Zusammen mit den vier Arten der Ameisenigel bildet es das Taxon der Kloakentiere (Monotremata), die sich stark von allen anderen Säugetieren unterscheiden."
    sv: "Näbbdjur är ett litet äggläggande däggdjur som lever i Australien. Det ser ut som en utter med bäversvans, men dessutom med en näbb. Arten tillhör ordningen kloakdjur, där näbbdjuret tillsammans med familjen myrpiggsvin utgör de enda medlemmarna."
