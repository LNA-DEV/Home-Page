  description:
    en: "The bald eagle is a bird of prey found in North America. A sea eagle, it has two known subspecies and forms a species pair with the white-tailed eagle, which occupies the same niche as the bald eagle in the Palearctic. Its range includes most of Canada and Alaska, all of the contiguous United States, and northern Mexico."
    de: "Der Weißkopfseeadler ist ein großer Greifvogel aus der Familie der Accipitridae. In Aussehen und Lebensweise ähnelt die Art sehr dem eurasischen Seeadler, die beiden Arten werden daher von manchen Autoren zu einer Superspezies vereinigt. Der Weißkopfseeadler ist der Wappenvogel der USA und daher auf deren Siegel zu sehen."
