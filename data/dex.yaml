  description:
    en: "The tiger is a large cat and a member of the genus Panthera native to Asia. It has a powerful, muscular body with a large head and paws, a long tail and orange fur with black, mostly vertical stripes. It is traditionally classified into nine recent subspecies, though some recognise only two subspecies, mainland Asian tigers and the island tigers of the Sunda Islands."
    de: "Der Königstiger, auch Bengal-Tiger oder Indischer Tiger, ist eine Unterart des Tigers, die zu den Festlandsunterarten zählt. Er ist auf dem Indischen Subkontinent verbreitet und wird von der IUCN als stark gefährdet (Endangered) eingestuft. Die gesamte Population wird auf weniger als 2500 Individuen geschätzt."
