    en: "The Eurasian hoopoe or common hoopoe is the most widespread species of the genus Upupa. It is a distinctive cinnamon coloured bird with black and white wings, a tall erectile crest, a broad white band across a black tail, and a long narrow downcurved bill. Its call is a soft \"oop-oop-oop\"."
    de: "Der Wiedehopf ist eine von drei Arten aus der Vogelfamilie der Wiedehopfe (Upupidae). Die Wiedehopfe werden gemeinsam mit der etwas artenreicheren Familie der Baumhopfe (Phoeniculidae) in die Ordnung der Bucerotiformes gestellt. Die Zuordnung zu den Rackenvögeln (Coraciiformes) ist nicht mehr üblich."
