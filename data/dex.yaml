  description:
    en: "The western capercaillie, also known as the Eurasian capercaillie, wood grouse, heather cock, cock-of-the-woods, or simply capercaillie, is a heavy member of the grouse tribe and the largest of all extant grouse species. Found across Europe and the Palearctic, this primarily-ground-dwelling forest grouse is renowned for its courtship display. The bird shows extreme sexual dimorphism, with males nearly twice the size of females."
    de: "Das Auerhuhn ist eine Vogelart aus der Familie der Fasanenartigen (Phasianidae) und der Ordnung der Hühnervögel (Galliformes). Es ist zugleich der größte Hühnervogel Europas. Es besiedelt Nadel-, Misch- und Laubwaldzonen von Schottland über Nordeuropa bis in den Osten Zentralsibiriens."
    sv: "Tjäder är en skogsfågel i familjen fasanfåglar. Den förekommer i öppna skogar i norra och mellersta Europa samt i norra Asien. Den är nära besläktad med orre och det förekommer hybrider mellan tjäder och andra hönsfåglar."
