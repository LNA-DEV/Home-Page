    en: "The Bornean orangutan is an orangutan species endemic to the island of Borneo. It belongs to the only genus of great apes native to Asia and is the largest of the three Pongo species. It has a coarse, reddish coat and up to 1.5 m long arms."
    de: "Der Borneo-Orang-Utan ist eine Menschenaffenart. Zusammen mit dem Sumatra-Orang-Utan und dem 2017 beschriebenen Tapanuli-Orang-Utan bildet er die Gattung der Orang-Utans. Er ist auf Borneo endemisch."
