    de: "Das Walross ist eine Robbenart, die in den kalten Meeren der Nordhalbkugel vorkommt. Zwei Unterarten, das Atlantische und das etwas größere Pazifische Walross, werden unterschieden. Das Walross gehört zur Ordnung der Raubtiere und ist die einzige Art in der Familie der Walrosse (Odobenidae)."
