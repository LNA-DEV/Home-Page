    de: "Die Östliche Smaragdeidechse ist eine große europäische Eidechsenart mit grüner Grundfärbung. Erst mit dem Nachweis mangelnder Kreuzbarkeit sowie nach weiteren vergleichenden genetischen Studien wird seit etwa 1991 anerkannt, dass es neben dieser noch eine weitere auch mitteleuropäisch vorkommende Spezies gibt, die Westliche Smaragdeidechse. Zuvor waren diese Arten nicht unterschieden worden, obwohl es schon früher Hinweise und Bestrebungen dazu gegeben hatte."
    sv: "Smaragdödla är en ödla med grönaktig kroppsfärg som förekommer i södra Europa. Tidigare sammanfattades den västra och den östra populationen till en enda art men numera avser Lacerta viridis den östra populationen medan den västra populationen räknas som Lacerta bilineata. Uppdelningen skedde under 1990-talet efter genetiska studier och då de två populationerna inte kan korsas med varandra."
