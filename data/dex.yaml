    de: "Die Wasseramsel oder Eurasische Wasseramsel ist die einzige auch in Mitteleuropa vorkommende Vertreterin der Familie der Wasseramseln (Cinclidae). Der etwa starengroße, rundlich wirkende Singvogel ist eng an das Leben entlang schnellfließender, klarer Gewässer gebunden. Dort ernährt sich die Art vornehmlich von Wasserinsekten, die sie vor allem tauchend erbeutet."
