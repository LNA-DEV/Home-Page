    en: "The common wombat, also known as the bare-nosed wombat, is a marsupial, one of three extant species of wombats and the sole extant member of the genus Vombatus. It has three subspecies: Vombatus ursinus hirsutus, found on the Australian mainland; Vombatus ursinus tasmaniensis, found in Tasmania; and Vombatus ursinus ursinus, found on Flinders Island and Maria Island in the Bass Strait."
    de: "Der Nacktnasenwombat ist eine Beutelsäugerart aus der Familie der Wombats (Vombatidae)."
