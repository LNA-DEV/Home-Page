    de: "Der Eisvogel ist die einzige in Mitteleuropa vorkommende Art aus der Familie der Eisvögel (Alcedinidae). Er besiedelt weite Teile Europas, Asiens sowie das westliche Nordafrika und lebt an mäßig schnell fließenden oder stehenden, klaren Gewässern mit Kleinfischbestand und Sitzwarten. Seine Nahrung setzt sich aus Fischen, Wasserinsekten, Kleinkrebsen und Kaulquappen zusammen."
