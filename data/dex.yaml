  description:
    en: "The yellowhammer is a passerine bird in the bunting family that is native to Eurasia and has been introduced to New Zealand and Australia. Most European birds remain in the breeding range year-round, but the eastern subspecies is partially migratory, with much of the population wintering further south. The male yellowhammer has a bright yellow head, streaked brown back, chestnut rump, and yellow under parts."
    de: "Die Goldammer ist eine Vogelart aus der Familie der Ammern (Emberizidae). Sie ist die häufigste Ammer in Europa und einer der charakteristischen Brutvögel der Feldmark. Außerhalb der Brutzeit bilden sich mitunter größere Trupps, die sich an günstigen Nahrungsplätzen am Rand von Dörfern oder an Fasanen- und Rebhuhnschütten einfinden."
