  description:
    en: "The Eurasian goshawk is a species of medium-large bird of prey in the family Accipitridae, a family which also includes other extant diurnal raptors, such as eagles, buzzards and harriers. It was formerly placed in the genus Accipiter. It is a widespread species that inhabits many of the temperate parts of Eurasia."
    de: "Der Habicht ist ein Greifvogel, der zur Familie der Habichtartigen (Accipitridae) gehört. Das Verbreitungsgebiet der Art umfasst die arktischen bis subtropischen Zonen der Paläarktis. Habichte ernähren sich überwiegend von kleinen bis mittelgroßen Vögeln und Säugetieren bis zu einem Gewicht von etwa 1,0 kg."
    sv: "Duvhök är en medelstor kraftfull hökfågel som traditionellt placeras i släktet Accipiter men som lyfts med sina närmaste släktingar till det egna släktet Astur. Den har ett stort utbredningsområde som sträcker sig över de tempererade områdena i Europa och Asien. Bestånd i Nordamerika som tidigare räknats till arten har urskilts som amerikansk duvhök."
  description_source:
    en: "https://en.wikipedia.org/wiki/Eurasian_goshawk"
    de: "https://de.wikipedia.org/wiki/Habicht"
    sv: "https://sv.wikipedia.org/wiki/Duvh%C3%B6k"
