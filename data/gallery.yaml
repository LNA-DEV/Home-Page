    sv: En grönbena står på en smal remsa ljus sand mellan mörk myrlera och djupblått vatten. Den lilla vadaren har bruna, kraftigt spräckliga ovansidor, vit buk, ett ljust ögonbrynsstreck och en rak mörk näbb; den ses i profil vänd åt höger.
